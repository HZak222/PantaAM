//  FIREBASE — deilður hakalisti milli tækja
//  Einfalt: einn slóð (/checked.json), reglulegt uppfletti (polling).
//  Engin flókin straumtenging — miklu áreiðanlegra.
// ══════════════════════════════════════════════
const fbReadChecked = async (fbUrl) => {
  const res = await fetch(`${fbUrl}/checked.json?t=${Date.now()}`);
  if(!res.ok) throw new Error(`Firebase villa: ${res.status}`);
  const d = await res.json();
  return d || {};
};

// Uppfærir EINN reit — annaðhvort merkir vöru (true) eða fjarlægir hana (null),
// snertir aldrei hökin sem önnur tæki eru að breyta á sama tíma.
const fbPatchChecked = async (fbUrl, id, value) => {
  const res = await fetch(`${fbUrl}/checked.json`, {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({[id]: value ? true : null})
  });
  if(!res.ok) throw new Error(`Firebase patch villa: ${res.status}`);
};

// Skrifar yfir ALLAN hakalistann — notað þegar admin hreinsar pöntun.
const fbWriteChecked = async (fbUrl, data) => {
  const res = await fetch(`${fbUrl}/checked.json`, {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data)
  });
  if(!res.ok) throw new Error(`Firebase write villa: ${res.status}`);
};

// ── Pöntunarsaga — vistuð handvirkt með "Vista í sögu" hnappi ──
// Hver VARA fær sína EIGIN flötu færslu (ekki ein færsla með mörgum vörum
// innan í) — þetta gerir talningu og CSV-útflutning einfaldan og beinan.
const fbReadHistory = async (fbUrl) => {
  const res = await fetch(`${fbUrl}/history.json?t=${Date.now()}`);
  if(!res.ok) throw new Error(`Firebase villa: ${res.status}`);
  const d = await res.json();
  return d || {};
};
// Vistar margar flatar færslur í einu skrifi (ein PATCH-aðgerð) —
// öruggt gagnvart öðrum tækjum sem gætu verið að skrifa á sama tíma.
const fbSaveHistoryEntries = async (fbUrl, entriesMap) => {
  const res = await fetch(`${fbUrl}/history.json`, {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(entriesMap)
  });
  if(!res.ok) throw new Error(`Firebase write villa: ${res.status}`);
};

// ══════════════════════════════════════════════
const norm = s=>(s||'').toLowerCase().replace(/[áä]/g,'a').replace(/[éê]/g,'e').replace(/[íî]/g,'i').replace(/[óö]/g,'o').replace(/[úü]/g,'u').replace(/ý/g,'y').replace(/ð/g,'d').replace(/þ/g,'th').replace(/æ/g,'ae');
const hits = (item,q)=>!q||norm(q).split(/\s+/).filter(Boolean).every(w=>norm(`${item.name} ${item.sku} ${item.sup}`).includes(w));
const grp  = (arr,key)=>arr.reduce((g,x)=>{(g[x[key]]=g[x[key]]||[]).push(x);return g;},{});
// Réttar Firebase RTDB slóðir enda á .firebaseio.com eða .firebasedatabase.app —
// algeng mistök eru að líma inn console.firebase.google.com slóðina í staðinn.
const isValidFbUrl = (url) => {
  if(!url) return false;
  if(url.includes('console.firebase.google.com')) return false;
  return /^https:\/\/[a-z0-9-]+\.(firebaseio\.com|[a-z0-9.-]+\.firebasedatabase\.app)\/?$/i.test(url.trim());
};
const buildOrder = (items,supName)=>{
  const dt=new Date().toLocaleDateString('is-IS');
  let b=supName?'Hæ,\n\nVið viljum panta eftirfarandi:\n\n':`Pöntunaryfirlit – ${dt}\n\n`;
  Object.entries(grp(items,'sup')).forEach(([s,its])=>{
    if(!supName) b+=`── ${s} ──\n`;
    its.forEach(i=>{b+=`• ${i.name}`;if(i.sku)b+=` (VNR: ${i.sku})`;b+=` — ${i.qty}\n`;});
    b+='\n';
  });
  return b+(supName?'\nKveðja,\nVerkstæðið':'\nSent frá Verkstæðinu');
};
const ghCommit = async (apiUrl,token,newData,message)=>{
  const r=await fetch(apiUrl,{headers:{Authorization:`token ${token}`,Accept:'application/vnd.github.v3+json'}});
  const d=await r.json();
  const content=btoa(unescape(encodeURIComponent(JSON.stringify(newData,null,2))));
  const body={message,content};
  if(r.ok&&d.sha) body.sha=d.sha;
  const put=await fetch(apiUrl,{method:'PUT',headers:{Authorization:`token ${token}`,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!put.ok){const e=await put.json();throw new Error(e.message||'commit villa');}
};
