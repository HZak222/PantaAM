  const [photoFile,    setPhotoFile]    = useState(null);
  const [photoPreview, setPhotoPreview] = useState(null);
  const [photoDesc,    setPhotoDesc]    = useState('');
  const [photoSending, setPhotoSending] = useState(false);
  const [photoErr,     setPhotoErr]     = useState(null);

  // Order share
  const [orderShare, setOrderShare] = useState(null);
  const [orderRefNum,setOrderRefNum]= useState('');
  const [historyEntries, setHistoryEntries] = useState([]);
  const [historyLoaded,  setHistoryLoaded]  = useState(false);
  const [historyLoading, setHistoryLoading] = useState(false);
  const [statsItem,      setStatsItem]      = useState(null); // {item, entries}
  const [clearConfirm,   setClearConfirm]   = useState(false);

  // ── INIT ─────────────────────────────────────
  useEffect(()=>{
    const n=localStorage.getItem('vrkst-name'); if(n){setUserName(n);setNameSet(true);}
    const tk=localStorage.getItem('vrkst-token'); if(tk) setGhToken(tk);
    fetchConfig();
    fetchItems();
  },[]);

  // ── FETCH CONFIG ─────────────────────────────
  const fetchConfig = async () => {
    try{
      const res=await fetch(`${CONFIG_URL}?t=${Date.now()}`);
      if(!res.ok) return;
      const d=await res.json();
      if(d.w3key&&!d.w3key.startsWith('SETJA_'))  setWeb3Key(d.w3key);
      if(d.imgbb_key&&!d.imgbb_key.startsWith('SETJA_')) setImgbbKey(d.imgbb_key);
      if(d.admin_name)                             setAdminName(d.admin_name);
      if(d.firebase_url&&!d.firebase_url.startsWith('SETJA_')) setFbUrl(d.firebase_url);
      if(Array.isArray(d.extra_categories)) setExtraCats(d.extra_categories);
      if(d.extra_suppliers&&typeof d.extra_suppliers==='object') setExtraSups(d.extra_suppliers);
    }catch{}
    finally{setConfigReady(true);}
  };

  // ── HAKALISTI — reglulegt uppfletti (polling) ──────────────
  // Einfaldasta og áreiðanlegasta leiðin til að halda öllum tækjum samstilltum:
  // spyrja Firebase á 3ja sek. fresti. Nýlegar staðbundnar breytingar (síðustu
  // 4 sek.) fá forgang svo eigin hök "flökti" ekki til baka meðan skrifið er
  // enn á leiðinni til netþjónsins.
  const fetchSharedState = async () => {
    if(!fbUrl) return;
    setSyncStatus('syncing');
    try{
      const remote = await fbReadChecked(fbUrl);
      setChecked(prev=>{
        const merged = {...remote};
        const now = Date.now();
        Object.keys(pendingRef.current).forEach(id=>{
          if(now - pendingRef.current[id] < 4000){
            if(prev[id]) merged[id]=true; else delete merged[id];
          } else {
            delete pendingRef.current[id];
          }
        });
        return merged;
      });
      setSyncStatus('synced');
      setSyncErrorCount(0);
    }catch{
      setSyncStatus('error');
      setSyncErrorCount(n=>n+1);
    }
  };

  useEffect(()=>{
    if(!(configReady&&fbUrl)) return;
    fetchSharedState(); // strax við tengingu
    const iv = setInterval(fetchSharedState, 3000);
    return ()=>clearInterval(iv);
  },[configReady,fbUrl]);

  // ── TOGGLE ITEM (shared) ───────────────────────
  // Uppfærir skjáinn samstundis (bjartsýn uppfærsla) og sendir bara
  // breytta reitinn til Firebase — snertir aldrei hök annarra notenda.
  const toggle = useCallback(id => {
    setChecked(prev => {
      const nextVal = !prev[id];
      const next = {...prev};
      if(nextVal) next[id]=true; else delete next[id];
      pendingRef.current[id] = Date.now();
      if(fbUrl) fbPatchChecked(fbUrl, id, nextVal).then(()=>setSyncStatus('synced')).catch(()=>setSyncStatus('error'));
      return next;
    });
  },[fbUrl]);

  // ── FETCH ITEMS ───────────────────────────────
  const fetchItems=async()=>{
    setLoading(true);
    try{
      const res=await fetch(`${ITEMS_URL}?t=${Date.now()}`);
      if(!res.ok) throw new Error();
      const d=await res.json();
      setItems(d);
      localStorage.setItem('vrkst-items',JSON.stringify(d));
    }catch{
      const ca=localStorage.getItem('vrkst-items'); if(ca) setItems(JSON.parse(ca));
    }
    finally{setLoading(false);}
  };

  // ── SAVE CONFIG ───────────────────────────────
  const buildFullConfig = (overrides={}) => ({
    w3key: web3Key, imgbb_key: imgbbKey, admin_name: adminName, admin_email: ADMIN_EMAIL,
    firebase_url: fbUrl, extra_categories: extraCats, extra_suppliers: extraSups, ...overrides
  });

  const saveConfig = async (newConf) => {
    if(!ghToken){showToast('GitHub token vantar');return;}
    setSaving(true);
    try{
      const full=buildFullConfig({w3key:newConf.w3||web3Key, imgbb_key:newConf.imgbb||imgbbKey, firebase_url:newConf.fbUrl||fbUrl});
      await ghCommit(CONFIG_API, ghToken, full, 'Uppfært config');
      if(newConf.w3)    setWeb3Key(newConf.w3);
      if(newConf.imgbb) setImgbbKey(newConf.imgbb);
      if(newConf.fbUrl) setFbUrl(newConf.fbUrl);
      setSettW3(''); setSettImgbb(''); setSettFbUrl('');
      showToast('✓ Config vistað á GitHub — allir notendur uppfærðir!');
    }catch(e){showToast(`Villa: ${e.message}`);}
    finally{setSaving(false);}
  };

  // ── BÆTA VIÐ FLOKKI ────────────────────────────
  const addCategory = async () => {
    const name = newCatName.trim();
    if(!name) return;
    if(!ghToken){showToast('GitHub token vantar');return;}
    if(CATS.includes(name)){showToast('Þessi flokkur er þegar til');return;}
    setSaving(true);
    try{
      const updated=[...extraCats, name];
      await ghCommit(CONFIG_API, ghToken, buildFullConfig({extra_categories:updated}), `Bætti við flokki: ${name}`);
      setExtraCats(updated); setNewCatName('');
      showToast(`✓ Flokkurinn "${name}" bættur við!`);
    }catch(e){showToast(`Villa: ${e.message}`);}
    finally{setSaving(false);}
  };

  // ── BÆTA VIÐ BIRGJA ────────────────────────────
  const addSupplier = async () => {
    const name = newSupName.trim();
    if(!name){showToast('Sláðu inn nafn birgja');return;}
    if(!ghToken){showToast('GitHub token vantar');return;}
    if(SUPS_LIST.includes(name)){showToast('Þessi birgi er þegar til');return;}
    setSaving(true);
    try{
      const updated={...extraSups, [name]:newSupEmail.trim()};
      await ghCommit(CONFIG_API, ghToken, buildFullConfig({extra_suppliers:updated}), `Bætti við birgja: ${name}`);
      setExtraSups(updated); setNewSupName(''); setNewSupEmail('');
      showToast(`✓ Birginn "${name}" bættur við!`);
    }catch(e){showToast(`Villa: ${e.message}`);}
    finally{setSaving(false);}
  };

  // ── ITEM CRUD ─────────────────────────────────
  const commitItems=async(newItems,msg)=>{
    if(!ghToken) throw new Error('GitHub token vantar');
    await ghCommit(ITEMS_API,ghToken,newItems,msg);
    setItems(newItems);
    localStorage.setItem('vrkst-items',JSON.stringify(newItems));
  };
  const addItem=async()=>{
    if(!newItem.name.trim()||!newItem.qty.trim()) return showToast('Fylltu út nafn og magn');
    setSaving(true);
    try{await commitItems([...items,{id:`u${Date.now()}`,...newItem}],`Bætt við: ${newItem.name}`);setNewItem({name:'',sku:'',sup:'Kemi',cat:'Efnavörur',qty:''});setModal(null);showToast('✓ Vöru bætt við!');}
    catch(e){showToast(`Villa: ${e.message}`);}
    finally{setSaving(false);}
  };

  // ── MAGNFLUTNINGUR (CSV úr Excel) ──────────────
  // Einfaldur CSV-þáttari sem ræður við bæði ; og , sem dálkaskil, og gæsalappir
  const parseCSVLine = (line, delim) => {
    const result=[]; let cur=''; let q=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(q){
        if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; }
        else cur+=ch;
      } else {
        if(ch==='"') q=true;
        else if(ch===delim){ result.push(cur); cur=''; }
        else cur+=ch;
      }
    }
    result.push(cur);
    return result.map(s=>s.trim());
  };

  const downloadCSVTemplate = () => {
    const csv = 'Nafn;VNR;Birgir;Flokkur;Magn\nDæmi vara;12345;Kemi;Efnavörur;2 stk\n';
    const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='vorur_snidmat.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const onBulkFile = (e) => {
    const f = e.target.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = ev => setBulkText(ev.target.result);
    reader.readAsText(f, 'utf-8');
    e.target.value='';
  };

  const previewBulkImport = () => {
    const text = bulkText.trim();
    if(!text){ showToast('Settu inn eða hladdu upp CSV fyrst'); return; }
    const lines = text.split(/\r?\n/).filter(l=>l.trim().length>0);
    if(lines.length<2){ showToast('Engar vörur fundust í skránni'); return; }
    const semi=(lines[0].match(/;/g)||[]).length;
    const comma=(lines[0].match(/,/g)||[]).length;
    const delim = semi>=comma ? ';' : ',';
    const header = parseCSVLine(lines[0],delim).map(h=>h.toLowerCase());
    const findCol=(aliases)=>{ for(const a of aliases){ const idx=header.findIndex(h=>h.includes(a)); if(idx>=0) return idx; } return -1; };
    const nameIdx=findCol(['nafn','name']);
    const skuIdx=findCol(['vnr','sku','vörunúmer']);
    const supIdx=findCol(['birg','sup']);
    const catIdx=findCol(['flokk','cat']);
    const qtyIdx=findCol(['magn','qty']);
    if(nameIdx<0){ showToast('Fann ekki dálkinn "Nafn" — athugaðu sniðmátið'); return; }

    const newItemsList=[]; const seenCats=new Set(); const seenSups=new Set();
    lines.slice(1).forEach((line,idx)=>{
      const cols = parseCSVLine(line, delim);
      const name = (cols[nameIdx]||'').trim();
      if(!name) return;
      const sup = ((supIdx>=0?cols[supIdx]:'')||'').trim() || 'Kemi';
      const cat = ((catIdx>=0?cols[catIdx]:'')||'').trim() || 'Efnavörur';
      const qty = ((qtyIdx>=0?cols[qtyIdx]:'')||'').trim() || '1 stk';
      const sku = ((skuIdx>=0?cols[skuIdx]:'')||'').trim();
      newItemsList.push({id:`imp${Date.now()}_${idx}`, name, sku, sup, cat, qty});
      seenCats.add(cat); seenSups.add(sup);
    });
    if(!newItemsList.length){ showToast('Engar gildar vörur fundust'); return; }

    const newCats = [...seenCats].filter(c=>!CATS.includes(c));
    const newSups = [...seenSups].filter(s=>!SUPS_LIST.includes(s));
    setBulkPreview({items:newItemsList, newCats, newSups});
  };

  const confirmBulkImport = async () => {
    if(!bulkPreview) return;
    if(!ghToken){ showToast('GitHub token vantar'); return; }
    setBulkImporting(true);
    try{
      if(bulkPreview.newCats.length || bulkPreview.newSups.length){
        const updatedCats = [...new Set([...extraCats, ...bulkPreview.newCats])];
        const updatedSups = {...extraSups};
        bulkPreview.newSups.forEach(s=>{ if(!(s in updatedSups)) updatedSups[s]=''; });
        await ghCommit(CONFIG_API, ghToken, buildFullConfig({extra_categories:updatedCats, extra_suppliers:updatedSups}), `Flutti inn ${bulkPreview.newCats.length} flokka / ${bulkPreview.newSups.length} birgja`);
        setExtraCats(updatedCats); setExtraSups(updatedSups);
      }
      const updatedItems = [...items, ...bulkPreview.items];
      await ghCommit(ITEMS_API, ghToken, updatedItems, `Flutti inn ${bulkPreview.items.length} vörur (CSV)`);
      setItems(updatedItems);
      localStorage.setItem('vrkst-items', JSON.stringify(updatedItems));
      showToast(`✓ ${bulkPreview.items.length} vörur fluttar inn!`);
      setBulkText(''); setBulkPreview(null); setModal(null);
    }catch(e){ showToast(`Villa: ${e.message}`); }
    finally{ setBulkImporting(false); }
  };

  const saveEdit=async()=>{
    if(!editItem?.name?.trim()||!editItem?.qty?.trim()) return showToast('Fylltu út nafn og magn');
    setSaving(true);
    try{await commitItems(items.map(i=>i.id===editItem.id?editItem:i),`Breytti: ${editItem.name}`);setEditItem(null);showToast('✓ Vara uppfærð!');}
    catch(e){showToast(`Villa: ${e.message}`);}
    finally{setSaving(false);}
  };
  const deleteItem=async(id)=>{
    setSaving(true);
    try{
      await commitItems(items.filter(i=>i.id!==id),'Eytti vöru');
      setChecked(prev=>{const next={...prev}; delete next[id]; return next;});
      if(fbUrl){ try{ await fbPatchChecked(fbUrl,id,false); }catch{} }
      setDelId(null); showToast('✓ Vöru eytt!');
    }catch(e){showToast(`Villa: ${e.message}`);}
    finally{setSaving(false);}
  };

  // ── SEND NOTIFICATION ─────────────────────────
  // Einfalt: bara tölvupóstur til admin um að vörur vanti.
  // Hakalistinn sjálfur er þegar samstilltur gegnum Firebase — engin
  // sérstök "notification" staða þarf að vistast neins staðar.
  const sendNotification=async()=>{
    if(!web3Key){showToast('Admin þarf að setja upp Web3Forms lykil (⚙️)');return;}
    if(!count) return;
    setNotifSending(true);
    try{
      const dtStr=new Date().toLocaleString('is-IS');
      const lines=checkedList.map(i=>`• ${i.name}${i.sku?` (VNR: ${i.sku})`:''} — ${i.qty}`).join('\n');
      const plain=`Frá: ${userName}\nDagsetning: ${dtStr}\n\nVörur sem vantar (${count} stk.):\n${lines}\n\n🙂`;
      const res=await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({access_key:web3Key,subject:'það vantar vörur',from_name:userName,message:plain,botcheck:false})});
      const d=await res.json();
      if(!d.success) throw new Error(d.message||'villa');
      setNotifDone(true);
      setHvatning(HVATNINGAR[Math.floor(Math.random()*HVATNINGAR.length)]);
    }catch(e){showToast(`Sending mistókst: ${e.message||'net villa'}`);}
    finally{setNotifSending(false);}
  };

  // ── CLEAR ORDER (admin) ───────────────────────
  // "Hreinsa pöntun" spyr núna hvort eigi að vista í sögu fyrst
  const clearOrder=async()=>{
    setChecked({});
    if(fbUrl){ try{ await fbWriteChecked(fbUrl,{}); }catch{} }
    showToast('✓ Pöntun hreinsuð');
  };

  // ── PÖNTUNARSAGA ───────────────────────────────
  // Hver vara fær SÍNA EIGIN flötu færslu (ekki eina færslu með mörgum vörum
  // innaní) — þannig er hægt að telja beint hversu oft hver vara var pöntuð.
  // Gamlar færslur (með .items fylki) eru sjálfkrafa "dreifðar" út í flatar
  // sýndarfærslur við lestur, svo eldri saga glatast ekki.
  const fetchHistory = async () => {
    if(!fbUrl) return [];
    setHistoryLoading(true);
    try{
      const raw = await fbReadHistory(fbUrl);
      const arr = [];
      Object.entries(raw).forEach(([key,val])=>{
        if(val && Array.isArray(val.items)){
          val.items.forEach(it=>{
            arr.push({batchId:key, date:val.date, by:val.by, supplier:val.supplier, refNum:val.refNum,
                       itemId:it.id, name:it.name, sku:it.sku, sup:it.sup, qty:it.qty});
          });
        } else if(val){
          arr.push({batchId: val.batchId||key, ...val});
        }
      });
      arr.sort((a,b)=> new Date(b.date) - new Date(a.date));
      setHistoryEntries(arr);
      setHistoryLoaded(true);
      return arr;
    }catch{ showToast('Gat ekki sótt pöntunarsögu'); return historyEntries; }
    finally{ setHistoryLoading(false); }
  };



  // Vistar ALLAN núverandi hakalistann — notað úr "Hreinsa pöntun" staðfestingunni
  const saveToHistoryFromChecked = async () => {
    if(!fbUrl || !checkedList.length) return;
    try{
      const batchId = `h${Date.now()}`;
      const dateIso = new Date().toISOString();
      const entriesMap = {}; const newLocal = [];
      checkedList.forEach((it,idx)=>{
        const entry = {batchId, date:dateIso, by:userName, supplier:'Allir birgjar', refNum:'', itemId:it.id, name:it.name, sku:it.sku||'', sup:it.sup, qty:it.qty};
        entriesMap[`${batchId}_${it.id||idx}`] = entry;
        newLocal.push(entry);
      });
      await fbSaveHistoryEntries(fbUrl, entriesMap);
      setHistoryEntries(prev=>[...newLocal, ...prev]);
    }catch(e){ showToast(`Villa við að vista sögu: ${e.message}`); }
  };

  // Telur hversu oft tiltekin vara hefur komið fyrir í sögunni síðustu N mánuði
  // — hver flöt færsla = ein pöntun, svo þetta er bara einföld talning núna.
  const countOrders = (entries, item, months) => {
    const cutoff = new Date();
    cutoff.setMonth(cutoff.getMonth()-months);
    return (entries||[]).filter(e=>{
      if(new Date(e.date) < cutoff) return false;
      return (item.id && e.itemId && e.itemId===item.id) || (e.name===item.name && e.sku===item.sku);
    }).length;
  };

  const openItemStats = async (item) => {
    let entries = historyEntries;
    if(!historyLoaded) entries = await fetchHistory();
    setStatsItem({item, entries});
  };

  // Hópar flötu færslurnar aftur saman eftir batchId — bara fyrir SÝN
  // í Saga-flipanum, svo pantanir líti út eins og áður (ein pöntun = einn kassi)
  const groupedHistory = useMemo(()=>{
    const g = {};
    historyEntries.forEach(e=>{
      const key = e.batchId || e.date;
      if(!g[key]) g[key] = {key, date:e.date, by:e.by, supplier:e.supplier, refNum:e.refNum, items:[]};
      g[key].items.push({name:e.name, sku:e.sku, qty:e.qty});
    });
    return Object.values(g).sort((a,b)=> new Date(b.date)-new Date(a.date));
  },[historyEntries]);

  // Sækir alla söguna sem .csv skrá — ein lína á hverja vöru, tilbúið fyrir talningu
  // Notar semíkommu (;) sem dálkaskil, þar sem íslenskt Excel notar kommu sem tugabrotstákn
  const exportHistoryCSV = () => {
    if(!historyEntries.length){ showToast('Engin saga til að sækja'); return; }
    const esc = v => `"${String(v??'').replace(/"/g,'""')}"`;
    let csv = 'Dagsetning;Sent af;Pöntunarhópur;Beiðnanúmer;Vara;VNR;Birgir;Magn\n';
    historyEntries.forEach(e=>{
      const dt = new Date(e.date).toLocaleString('is-IS');
      csv += [esc(dt), esc(e.by), esc(e.supplier), esc(e.refNum), esc(e.name), esc(e.sku), esc(e.sup||''), esc(e.qty)].join(';')+'\n';
    });
    const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `pontunarsaga_${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  // ── PHOTO ─────────────────────────────────────
  const onPhotoChange=e=>{const f=e.target.files[0];if(!f)return;setPhotoFile(f);setPhotoPreview(URL.createObjectURL(f));setPhotoErr(null);setModal('photo');};
  // Þjappar mynd niður í Blob (ekki base64) — hentar sem alvöru viðhengi
  const compressImgBlob=(file,max=900,q=0.7)=>new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      let{width:w,height:h}=img;
      if(w>max||h>max){const r=Math.min(max/w,max/h);w=Math.round(w*r);h=Math.round(h*r);}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      c.toBlob(blob=>blob?res(blob):rej(new Error('compress')),'image/jpeg',q);
    };
    img.onerror=rej;img.src=URL.createObjectURL(file);
  });

  const sendPhoto=async()=>{
    if(!web3Key){setPhotoErr('Admin þarf að setja upp Web3Forms lykil (⚙️)');return;}
    if(photoSending)return;
    setPhotoSending(true);setPhotoErr(null);
    try{
      let imgLine='';
      if(photoFile){
        if(!imgbbKey){
          imgLine='\n(Mynd fylgdi ekki — admin þarf að setja upp imgbb lykil í stillingum)';
        }else{
          try{
            const blob=await compressImgBlob(photoFile);
            const fd=new FormData();
            fd.append('image', blob, 'tillaga.jpg');
            const up=await fetch(`https://api.imgbb.com/1/upload?key=${imgbbKey}`,{method:'POST',body:fd});
            const upData=await up.json();
            if(upData.success) imgLine=`\nMynd: ${upData.data.url}`;
            else imgLine='\n(Mynd tókst ekki að hlaða upp)';
          }catch{ imgLine='\n(Mynd tókst ekki að hlaða upp)'; }
        }
      }
      const plain=`Tillaga að nýrri vöru\nSendandi: ${userName}\nDagsetning: ${new Date().toLocaleString('is-IS')}\nLýsing: ${photoDesc||'(engin lýsing)'}${imgLine}\n\n📦`;
      const res=await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({access_key:web3Key,subject:`Tillaga að vöru frá ${userName}`,from_name:userName,message:plain,botcheck:false})});
      const d=await res.json();
      if(!d.success) throw new Error(d.message||'villa');
      showToast('✓ Tillaga send!');resetPhoto();
    }catch(e){setPhotoErr(`Sending mistókst: ${e.message}`);}
    finally{setPhotoSending(false);}
  };
  const resetPhoto=()=>{setPhotoFile(null);setPhotoPreview(null);setPhotoDesc('');setPhotoErr(null);setModal(null);if(photoRef.current)photoRef.current.value='';};

  // ── ORDER SHARE ───────────────────────────────
  const openOrderShare=(supName=null)=>{
    const its=supName?checkedList.filter(i=>i.sup===supName):checkedList;
    if(!its.length)return;
    const dt=new Date().toLocaleDateString('is-IS');
    setOrderRefNum('');
    setOrderShare({to:supName?(SUPS_MAP[supName]||ADMIN_EMAIL):ADMIN_EMAIL,subject:supName?`Pöntun ${dt} – ${its.length} vörur`:`Pöntunaryfirlit ${dt} – ${count} vörur`,body:buildOrder(its,supName),supplierName:supName||'Allir birgjar',items:its});
  };


  // ── CONFETTI / FLUGELDAR ─────────────────────
  useEffect(()=>{
    if(!notifDone) return;
    const canvas = confettiRef.current;
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio||1;
    const resize = ()=>{
      canvas.width = canvas.offsetWidth*dpr;
      canvas.height = canvas.offsetHeight*dpr;
      ctx.scale(dpr,dpr);
    };
    resize();
    const W = canvas.offsetWidth, H = canvas.offsetHeight;
    const colors = ['#E85D04','#22c55e','#f59e0b','#3b82f6','#ec4899','#fff'];
    const particles = [];
    // Confetti burst
    for(let i=0;i<90;i++){
      particles.push({
        x: W/2, y: H*0.35,
        vx: (Math.random()-0.5)*14,
        vy: (Math.random()-1.4)*13,
        size: 4+Math.random()*5,
        color: colors[Math.floor(Math.random()*colors.length)],
        rot: Math.random()*360,
        vrot: (Math.random()-0.5)*20,
        shape: Math.random()>0.5?'rect':'circle',
        gravity: 0.35+Math.random()*0.15,
        life: 1
      });
    }
    let raf;
    const tick = ()=>{
      ctx.clearRect(0,0,W,H);
      let alive=false;
      particles.forEach(p=>{
        if(p.life<=0) return;
        alive=true;
        p.vy += p.gravity;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vrot;
        p.life -= 0.008;
        ctx.save();
        ctx.globalAlpha = Math.max(p.life,0);
        ctx.translate(p.x,p.y);
        ctx.rotate(p.rot*Math.PI/180);
        ctx.fillStyle = p.color;
        if(p.shape==='rect') ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
        else { ctx.beginPath(); ctx.arc(0,0,p.size/2,0,Math.PI*2); ctx.fill(); }
        ctx.restore();
      });
      if(alive) raf = requestAnimationFrame(tick);
    };
    tick();
    return ()=>{ if(raf) cancelAnimationFrame(raf); };
  },[notifDone]);

  // ── MISC ──────────────────────────────────────
  const startVoice=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){showToast('Hljóðþekking er ekki studd');return;}const r=new SR();r.lang='is-IS';r.onstart=()=>setListening(true);r.onend=()=>setListening(false);r.onerror=()=>setListening(false);r.onresult=e=>{setQuery(e.results[0][0].transcript);setAllCats(false);};r.start();};
  // Annar innskráður admin (auk aðal-lykilorðsins hér að ofan): "Búri"
  const loginAdmin=()=>{
    const stored=localStorage.getItem('vrkst-pw')||DEFAULT_PW;
    if(pwInput===stored){setIsAdmin(true);setPwError(false);setPwInput('');}
    else if(pwInput==='JLRburi'){setIsAdmin(true);setPwError(false);setPwInput('');setUserName('Búri');localStorage.setItem('vrkst-name','Búri');}
    else setPwError(true);
  };
  const showToast=msg=>{setToast(msg);setTimeout(()=>setToast(null),2800);};

  // ── DERIVED ───────────────────────────────────
  const visible=useMemo(()=>{let it=allCats?items:items.filter(i=>i.cat===cat);if(supF)it=it.filter(i=>i.sup===supF);if(query)it=it.filter(i=>hits(i,query));return it;},[items,cat,query,supF,allCats]);
  const grouped    =useMemo(()=>grp(visible,'sup'),[visible]);
  const checkedList=useMemo(()=>items.filter(i=>checked[i.id]),[items,checked]);
  const checkedGrp =useMemo(()=>grp(checkedList,'sup'),[checkedList]);
  const count      =checkedList.length;
  const suppliers  =useMemo(()=>[...new Set(items.filter(i=>i.cat===cat).map(i=>i.sup))],[items,cat]);
  // Fullur listi flokka og birgja — grunngildi + það sem admin hefur bætt við
  const CATS     = useMemo(()=>[...new Set(['Efnavörur','Perur',...extraCats])],[extraCats]);
  const SUPS_MAP = useMemo(()=>({...SUP_EMAILS, ...extraSups}),[extraSups]);
  const SUPS_LIST= useMemo(()=>Object.keys(SUPS_MAP),[SUPS_MAP]);

  const Divider=({label})=>(
    <div style={{display:'flex',alignItems:'center',padding:'8px 16px 2px',gap:8}}>
      <div style={{height:1,flex:1,background:C.bd}}/><span style={{fontSize:10,color:C.mut,letterSpacing:2,textTransform:'uppercase',fontWeight:600}}>{label}</span><div style={{height:1,flex:1,background:C.bd}}/>
    </div>
  );

  // ── SYNC STATUS indicator ─────────────────────
  const SyncDot=()=>{
    if(!fbUrl) return null;
    const color = syncStatus==='synced'?C.grn : syncStatus==='error'?C.red : C.amb;
    const cls   = syncStatus==='syncing'?'blink':'';
    return <div title={syncStatus==='synced'?'Samstillt':syncStatus==='error'?'Samstillingarerror':'Samstilli...'} className={cls} style={{width:6,height:6,borderRadius:'50%',background:color,flexShrink:0}}/>;
  };

  // ══════════════════════════════════════
  //  NAME SETUP
  // ══════════════════════════════════════
  if(!nameSet) return(
    <div style={{background:C.bg,height:'100%',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:32}}>
      <div style={{fontFamily:'Oxanium,sans-serif',fontSize:32,fontWeight:700,color:C.acc,marginBottom:4}}>VERKSTÆÐIÐ</div>
      <div style={{fontSize:11,color:C.mut,letterSpacing:2,textTransform:'uppercase',marginBottom:48}}>Efnalager · Pöntunarkerfi</div>
      <div style={{width:'100%',maxWidth:320}}>
        <div style={{fontSize:18,fontWeight:600,marginBottom:6}}>Hvað heitirðu?</div>
        <div style={{fontSize:13,color:C.mut,marginBottom:20}}>Nafnið þitt birtist þegar þú sendir inn beiðni</div>
        <input value={userName} onChange={e=>setUserName(e.target.value)}
          onKeyDown={e=>{if(e.key==='Enter'&&userName.trim()){localStorage.setItem('vrkst-name',userName.trim());setNameSet(true);}}}
          placeholder="Nafn þitt..." autoFocus
          style={{width:'100%',background:C.s1,border:`1px solid ${C.bd}`,borderRadius:12,padding:'14px 16px',color:C.txt,fontSize:16,outline:'none',fontFamily:'inherit',marginBottom:12}}/>
        <button onClick={()=>{if(!userName.trim())return;localStorage.setItem('vrkst-name',userName.trim());setNameSet(true);}}
          className="tap" style={{width:'100%',padding:14,borderRadius:12,border:'none',background:userName.trim()?C.acc:'#222',color:'#fff',fontSize:15,fontWeight:600,cursor:'pointer'}}>
          Áfram →
        </button>
      </div>
    </div>
  );

  // ══════════════════════════════════════
  //  MAIN APP
  // ══════════════════════════════════════
  return(
    <div style={{background:C.bg,color:C.txt,height:'100%',maxWidth:480,margin:'0 auto',display:'flex',flexDirection:'column',overflow:'hidden',position:'relative'}}>

      {/* HEADER */}
      <div style={{padding:'12px 16px 10px',borderBottom:`1px solid ${C.bd}`,flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <div>
              <div style={{fontFamily:'Oxanium,sans-serif',fontSize:24,fontWeight:700,color:C.acc,letterSpacing:1,lineHeight:1}}>VERKSTÆÐIÐ</div>
              <div style={{fontSize:10,color:C.mut,letterSpacing:1.5,textTransform:'uppercase',marginTop:1,display:'flex',alignItems:'center',gap:5}}>
                {userName} {isAdmin&&<span style={{color:C.acc,fontWeight:700}}>· Admin</span>}
                <SyncDot/>
              </div>
            </div>
          </div>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            {isAdmin&&count>0&&<div style={{background:C.acc,color:'#fff',borderRadius:20,padding:'3px 10px',fontSize:13,fontWeight:600,display:'flex',alignItems:'center',gap:4}}><ICart s={13} c="#fff"/> {count}</div>}
            <button onClick={()=>setModal('settings')} className="tap" style={{background:'none',border:'none',color:isAdmin?C.acc:C.mut,cursor:'pointer',padding:4,display:'flex'}}>
              <IGear s={20} c={isAdmin?C.acc:C.mut}/>
            </button>
          </div>
        </div>
        {/* SEARCH */}
        <div style={{display:'flex',gap:6}}>
          <div style={{flex:1,display:'flex',alignItems:'center',background:C.s1,border:`1px solid ${C.bd}`,borderRadius:10,padding:'8px 10px',gap:7}}>
            <ISearch s={14} c={C.mut}/>
            <input value={query} onChange={e=>{setQuery(e.target.value);setAllCats(false);}} onKeyDown={e=>e.key==='Enter'&&(setAllCats(true),setSupF(''))} placeholder="Leita..." style={{flex:1,background:'none',border:'none',outline:'none',color:C.txt,fontSize:14,fontFamily:'inherit'}}/>
            {query&&<button onClick={()=>{setQuery('');setSupF('');setAllCats(false);}} className="tap" style={{background:'none',border:'none',color:C.mut,cursor:'pointer',padding:0,display:'flex'}}><IX s={13} c={C.mut}/></button>}
          </div>
          <button onClick={startVoice} className={`tap${listening?' puls':''}`} style={{width:38,height:38,borderRadius:10,border:'none',cursor:'pointer',background:listening?C.acc:C.s1,display:'flex',alignItems:'center',justifyContent:'center'}}>
            <IMic s={15} c={listening?'#fff':C.mut}/>
          </button>
          <button onClick={()=>{if(!loading){fetchItems();fetchSharedState();}}} className="tap" style={{width:38,height:38,borderRadius:10,border:`1px solid ${C.bd}`,background:C.s1,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>
            <IRefresh s={14} c={C.mut} cls={loading?'spin':''}/>
          </button>
        </div>
      </div>

      {/* SYNC ERROR WARNING — birtist ef Firebase svarar ekki (t.d. útrunnar test-mode reglur) */}
      {syncErrorCount>=2&&fbUrl&&(
        <div style={{background:'rgba(239,68,68,.08)',borderBottom:`1px solid rgba(239,68,68,.25)`,padding:'8px 16px',display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
          <IX s={13} c={C.red}/>
          <span style={{fontSize:12,color:C.red,fontWeight:600,flex:1,lineHeight:1.4}}>
            Samstilling milli tækja virkar ekki núna{isAdmin?' — athugaðu Firebase Rules (líklega útrunnin test-mode)':''}
          </span>
        </div>
      )}

      {/* FILTERS */}
      {view==='list'&&(
        <div style={{padding:'8px 16px',borderBottom:`1px solid ${C.bd}`,flexShrink:0}}>
          <div style={{display:'flex',gap:6,marginBottom:7}}>
            {CATS.map(c=>(
              <button key={c} className="tap" onClick={()=>{setCat(c);setSupF('');setAllCats(false);}}
                style={{padding:'5px 13px',borderRadius:20,border:'none',background:cat===c&&!allCats?C.acc:C.s2,color:cat===c&&!allCats?'#fff':C.mut,fontSize:12,fontWeight:500,cursor:'pointer',display:'flex',alignItems:'center',gap:5}}>
                {c==='Efnavörur'?<IBox s={11} c={cat===c&&!allCats?'#fff':C.mut}/>:<IBulb s={11} c={cat===c&&!allCats?'#fff':C.mut}/>}{c}
              </button>
            ))}
          </div>
          {!allCats&&<div className="hscroll">
            {['',...(Array.isArray(suppliers)?suppliers:[])].map(s=>(
              <button key={s||'all'} className="tap" onClick={()=>setSupF(supF===s?'':s)}
                style={{padding:'3px 9px',borderRadius:12,fontSize:11,whiteSpace:'nowrap',fontFamily:'inherit',cursor:'pointer',border:`1px solid ${supF===s?C.acc:C.bd}`,background:supF===s?'rgba(232,93,4,.12)':'transparent',color:supF===s?C.acc:C.mut}}>
                {s||'Allar'}
              </button>
            ))}
          </div>}
        </div>
      )}

      {/* SCROLL AREA */}
      <div style={{flex:1,overflowY:'auto'}}>

        {/* LIST VIEW */}
        {view==='list'&&(
          <>
            {loading&&items.length===0&&<div style={{textAlign:'center',padding:'60px 20px',color:C.mut}}><IRefresh s={32} c={C.mut} cls="spin" st={{opacity:.3}}/><div style={{fontSize:14,marginTop:12}}>Sæki vörulista...</div></div>}
            {!fbUrl&&configReady&&!isAdmin&&(
              <div style={{margin:'16px',padding:'12px 14px',background:'rgba(245,158,11,.06)',border:`1px solid rgba(245,158,11,.15)`,borderRadius:10,display:'flex',gap:10,alignItems:'flex-start'}}>
                <IWifi s={16} c={C.amb} st={{flexShrink:0,marginTop:2}}/>
                <div style={{fontSize:12,color:'#999',lineHeight:1.5}}>Deiling milli tækja er ekki sett upp. Admin þarf að stilla Firebase í stillingum (⚙️).</div>
              </div>
            )}
            {Object.entries(grouped).map(([sup,its])=>(
              <div key={sup}>
                <Divider label={sup}/>
                {its.map(item=>(
                  <div key={item.id} style={{display:'flex',alignItems:'center',padding:'10px 16px',gap:11,
                    background:checked[item.id]?'rgba(34,197,94,.06)':'transparent',
                    borderLeft:checked[item.id]?`3px solid ${C.grn}`:'3px solid transparent',
                    transition:'background .12s,border-color .12s'}}>
                    {/* Checkbox */}
                    <div onClick={()=>toggle(item.id)} className="tap" style={{width:22,height:22,borderRadius:6,flexShrink:0,cursor:'pointer',border:`2px solid ${checked[item.id]?C.grn:'#3a3a3a'}`,background:checked[item.id]?C.grn:'transparent',display:'flex',alignItems:'center',justifyContent:'center',transition:'all .15s'}}>
                      {checked[item.id]&&<ICheck s={13} c="#fff"/>}
                    </div>
                    {/* Name */}
                    <div onClick={()=>toggle(item.id)} className="tap" style={{flex:1,minWidth:0,cursor:'pointer'}}>
                      <div style={{fontSize:14,fontWeight:500,color:checked[item.id]?'#3a3a3a':C.txt,textDecoration:checked[item.id]?'line-through':'none',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{item.name}</div>
                      <div style={{fontSize:10,color:'#3d3d3d',marginTop:1,fontFamily:"'Fira Code',monospace",display:'flex',gap:8}}>
                        {item.sku&&<span>#{item.sku}</span>}<span>→ {item.qty}</span>
                      </div>
                    </div>
                    {/* Admin edit/delete/stats */}
                    {isAdmin&&(
                      <div style={{display:'flex',gap:2,flexShrink:0}}>
                        <button onClick={()=>openItemStats(item)} className="tap" style={{background:'none',border:'none',cursor:'pointer',padding:6,display:'flex'}}><IChart s={14} c="#555"/></button>
                        <button onClick={()=>setEditItem({...item})} className="tap" style={{background:'none',border:'none',cursor:'pointer',padding:6,display:'flex'}}><IEdit s={14} c="#555"/></button>
                        <button onClick={()=>setDelId(item.id)} className="tap" style={{background:'none',border:'none',cursor:'pointer',padding:6,display:'flex'}}><ITrash s={14} c="#555"/></button>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            ))}
            <div style={{height:count>0?140:80}}/>
          </>
        )}

        {/* ORDER VIEW (admin only) */}
        {view==='order'&&isAdmin&&(
          <>
            {count===0
              ?<div style={{textAlign:'center',padding:'80px 20px',color:C.mut}}><ICart s={48} c={C.mut} st={{opacity:.12}}/><div style={{fontSize:16,marginTop:14}}>Pöntunin er tóm</div></div>
              :(
                <>
                  {Object.entries(checkedGrp).map(([sup,its])=>(
                    <div key={sup} style={{margin:'12px 16px 0',background:C.s1,borderRadius:12,border:`1px solid ${C.bd}`,overflow:'hidden'}}>
                      <div style={{padding:'10px 14px 8px',borderBottom:`1px solid ${C.bd}`,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                        <div><div style={{fontWeight:600,fontSize:14}}>{sup}</div>{SUPS_MAP[sup]&&<div style={{fontSize:10,color:C.mut,fontFamily:"'Fira Code',monospace",marginTop:1}}>{SUPS_MAP[sup]}</div>}</div>
                        <button onClick={()=>openOrderShare(sup)} className="tap" style={{background:'rgba(232,93,4,.1)',border:'1px solid rgba(232,93,4,.25)',color:C.acc,padding:'5px 11px',borderRadius:8,fontSize:11,fontWeight:600,cursor:'pointer',display:'flex',alignItems:'center',gap:4,fontFamily:'inherit'}}><IMail s={11} c={C.acc}/> Senda</button>
                      </div>
                      {its.map((item,i)=>(
                        <div key={item.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 14px',borderBottom:i<its.length-1?`1px solid ${C.bd}`:'none'}}>
                          <div style={{flex:1,minWidth:0}}><div style={{fontSize:13,fontWeight:500,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{item.name}</div><div style={{fontSize:10,color:C.mut,fontFamily:"'Fira Code',monospace",marginTop:1}}>{item.sku?`#${item.sku} · `:''}{item.qty}</div></div>
                          <button onClick={()=>toggle(item.id)} className="tap" style={{background:'none',border:'none',cursor:'pointer',padding:4,display:'flex',marginLeft:8}}><IX s={13} c="#555"/></button>
                        </div>
                      ))}
                    </div>
                  ))}
                  <div style={{padding:'16px',display:'flex',flexDirection:'column',gap:8}}>
                    <button onClick={()=>openOrderShare()} className="tap" style={{width:'100%',padding:14,borderRadius:12,border:'none',background:C.acc,color:'#fff',fontSize:14,fontWeight:600,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:8,fontFamily:'inherit'}}>
                      <IMail s={16} c="#fff"/> Senda yfirlit til mín · {count} vörur
                    </button>
                    <button onClick={()=>setClearConfirm(true)} className="tap" style={{width:'100%',padding:12,borderRadius:12,background:'transparent',border:`1px solid #2a2a2a`,color:C.mut,fontSize:13,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:7,fontFamily:'inherit'}}>
                      <ITrash s={13} c={C.mut}/> Hreinsa pöntun (eftir sendingu)
                    </button>
                  </div>
                  <div style={{height:80}}/>
                </>
              )
            }
          </>
        )}

        {/* ═══ PÖNTUNARSAGA (admin only) ═══ */}
        {view==='history'&&isAdmin&&(
          <>
            <div style={{padding:'14px 16px 4px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <div style={{fontSize:13,color:C.mut}}>{groupedHistory.length} pantanir skráðar · {historyEntries.length} vörulínur</div>
              <button onClick={exportHistoryCSV} disabled={!historyEntries.length} className="tap"
                style={{background:'rgba(232,93,4,.1)',border:'1px solid rgba(232,93,4,.25)',color:C.acc,padding:'6px 12px',borderRadius:8,fontSize:12,fontWeight:600,cursor:'pointer',display:'flex',alignItems:'center',gap:6,fontFamily:'inherit',opacity:historyEntries.length?1:.4}}>
                <IDownload s={13} c={C.acc}/> Sækja CSV
              </button>
            </div>

            {historyLoading&&(
              <div style={{textAlign:'center',padding:'50px 20px',color:C.mut}}>
                <IRefresh s={28} c={C.mut} cls="spin" st={{opacity:.3}}/>
                <div style={{fontSize:13,marginTop:10}}>Sæki sögu...</div>
              </div>
            )}

            {!historyLoading&&groupedHistory.length===0&&(
              <div style={{textAlign:'center',padding:'70px 20px',color:C.mut}}>
                <IClock s={42} c={C.mut} st={{opacity:.15}}/>
                <div style={{fontSize:15,marginTop:14}}>Engin saga ennþá</div>
                <div style={{fontSize:12,marginTop:6}}>Smelltu á "Vista í sögu" þegar þú sendir pöntun</div>
              </div>
            )}

            {!historyLoading&&groupedHistory.map((e)=>(
              <div key={e.key} style={{margin:'8px 16px',background:C.s1,borderRadius:12,border:`1px solid ${C.bd}`,overflow:'hidden'}}>
                <div style={{padding:'10px 14px',borderBottom:`1px solid ${C.bd}`,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <div>
                    <div style={{fontSize:13,fontWeight:600}}>{e.supplier}{e.refNum?` · ${e.refNum}`:''}</div>
                    <div style={{fontSize:11,color:C.mut,marginTop:1}}>{new Date(e.date).toLocaleString('is-IS')} · {e.by}</div>
                  </div>
                  <div style={{fontSize:11,color:C.acc,fontWeight:600}}>{(e.items||[]).length} vörur</div>
                </div>
                <div style={{padding:'6px 14px'}}>
                  {(e.items||[]).map((it,i)=>(
                    <div key={i} style={{fontSize:12,color:C.txt,padding:'4px 0',borderBottom:i<e.items.length-1?`1px solid ${C.bd}`:'none'}}>
                      {it.name} <span style={{color:C.mut}}>— {it.qty}</span>
                    </div>
                  ))}
                </div>
              </div>
            ))}
            <div style={{height:80}}/>
          </>
        )}
      </div>

      {/* BOTTOM NAV */}
      <div style={{display:'flex',borderTop:`1px solid ${C.bd}`,flexShrink:0}}>
        <button onClick={()=>setView('list')} className="tap" style={{flex:1,padding:'11px 8px',border:'none',background:'transparent',color:view==='list'?C.acc:C.mut,borderTop:view==='list'?`2px solid ${C.acc}`:'2px solid transparent',display:'flex',flexDirection:'column',alignItems:'center',gap:3,cursor:'pointer',marginTop:-1,fontFamily:'inherit'}}>
          <IBox s={18} c={view==='list'?C.acc:C.mut}/><span style={{fontSize:11,fontWeight:view==='list'?600:400}}>Lager</span>
        </button>
        {isAdmin&&(
          <button onClick={()=>setView('order')} className="tap" style={{flex:1,padding:'11px 8px',border:'none',background:'transparent',color:view==='order'?C.acc:C.mut,borderTop:view==='order'?`2px solid ${C.acc}`:'2px solid transparent',display:'flex',flexDirection:'column',alignItems:'center',gap:3,cursor:'pointer',marginTop:-1,fontFamily:'inherit'}}>
            <ICart s={18} c={view==='order'?C.acc:C.mut}/><span style={{fontSize:11,fontWeight:view==='order'?600:400}}>Pöntun{count>0?` (${count})`:''}</span>
          </button>
        )}
        {isAdmin&&(
          <button onClick={()=>{setView('history'); if(!historyLoaded) fetchHistory();}} className="tap" style={{flex:1,padding:'11px 8px',border:'none',background:'transparent',color:view==='history'?C.acc:C.mut,borderTop:view==='history'?`2px solid ${C.acc}`:'2px solid transparent',display:'flex',flexDirection:'column',alignItems:'center',gap:3,cursor:'pointer',marginTop:-1,fontFamily:'inherit'}}>
            <IClock s={18} c={view==='history'?C.acc:C.mut}/><span style={{fontSize:11,fontWeight:view==='history'?600:400}}>Saga</span>
          </button>
        )}
      </div>

      {/* FABs */}
      <input ref={photoRef} type="file" accept="image/*" capture="environment" style={{display:'none'}} onChange={onPhotoChange}/>
      <button onClick={()=>photoRef.current&&photoRef.current.click()} className="tap"
        style={{position:'absolute',right:16,bottom:count>0&&!isAdmin?134:74,background:C.s1,border:`1px solid ${C.bd}`,borderRadius:14,padding:'9px 13px',display:'flex',alignItems:'center',gap:7,cursor:'pointer',boxShadow:'0 4px 16px rgba(0,0,0,.5)',zIndex:10}}>
        <ICamera s={16} c={C.acc}/><span style={{fontSize:12,fontWeight:600,color:C.txt,whiteSpace:'nowrap'}}>Senda inn tillögu af vöru</span>
      </button>
      {isAdmin&&<button onClick={()=>setModal('addItem')} className="tap" style={{position:'absolute',left:16,bottom:74,background:C.s1,border:`1px solid ${C.bd}`,borderRadius:14,padding:'9px 13px',display:'flex',alignItems:'center',gap:7,cursor:'pointer',boxShadow:'0 4px 16px rgba(0,0,0,.5)',zIndex:10}}><IPlus s={16} c={C.acc}/><span style={{fontSize:12,fontWeight:600,color:C.txt}}>Bæta við vöru</span></button>}
      {!isAdmin&&count>0&&(
        <div className="anim" style={{position:'absolute',bottom:74,left:16,right:16,zIndex:20}}>
          <button onClick={sendNotification} disabled={notifSending} className="tap"
            style={{width:'100%',padding:'14px',borderRadius:14,border:'none',background:notifSending?'#2a2a2a':C.acc,color:'#fff',fontSize:15,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:9,boxShadow:'0 4px 22px rgba(232,93,4,.4)',fontFamily:'inherit'}}>
            {notifSending?<><IRefresh s={17} c="#fff" cls="spin"/>Sendi...</>:<><IBell s={17} c="#fff"/>Láta vita · {count} vörur</>}
          </button>
        </div>
      )}

      {/* ══════════════ MODALS ══════════════ */}

      {/* SETTINGS */}
      {modal==='settings'&&(
        <Sheet onClose={()=>setModal(null)}>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16}}>
            <div style={{width:38,height:38,borderRadius:'50%',background:isAdmin?C.acc:C.s2,border:`2px solid ${isAdmin?C.acc:C.bd}`,display:'flex',alignItems:'center',justifyContent:'center'}}>{isAdmin?<IShield s={18} c="#fff"/>:<IUser s={18} c={C.mut}/>}</div>
            <div><div style={{fontSize:14,fontWeight:600}}>{userName}</div><div style={{fontSize:11,color:isAdmin?C.acc:C.mut}}>{isAdmin?'Admin':'Notandi'}</div></div>
          </div>
          <Field label="Nafn" value={userName} onChange={v=>{setUserName(v);localStorage.setItem('vrkst-name',v);}} placeholder="Nafn þitt"/>
          <div style={{height:1,background:C.bd,margin:'12px 0'}}/>
          {!isAdmin?(
            <>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}><ILock s={14} c={C.mut}/><span style={{fontSize:12,color:C.mut}}>Admin innskráning</span></div>
              <Field label="Lykilorð" value={pwInput} onChange={setPwInput} placeholder="Admin lykilorð" type="password" action={{label:'Innskrá',fn:loginAdmin}}/>
              {pwError&&<div style={{fontSize:12,color:C.red,marginTop:-8,marginBottom:8}}>Rangt lykilorð</div>}
            </>
          ):(
            <>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:16}}><IKey s={14} c={C.acc}/><span style={{fontSize:13,color:C.acc,fontWeight:600}}>Admin stillingar</span><button onClick={()=>setIsAdmin(false)} style={{marginLeft:'auto',background:'none',border:'none',color:C.mut,cursor:'pointer',fontSize:11,padding:'4px 8px',borderRadius:6,fontFamily:'inherit'}}>Útskrá</button></div>

              <Field label="Nýtt lykilorð" value={newPw} onChange={setNewPw} placeholder="Breyta lykilorði" type="password"
                action={newPw?{label:'Vista',fn:()=>{localStorage.setItem('vrkst-pw',newPw);setNewPw('');showToast('✓ Lykilorð breytt!');}}:undefined}/>

              <div style={{height:1,background:C.bd,margin:'8px 0 14px'}}/>

              {/* Firebase setup */}
              <div style={{background: fbUrl&&!isValidFbUrl(fbUrl)?'rgba(239,68,68,.08)':'rgba(255,170,0,.06)', border: `1px solid ${fbUrl&&!isValidFbUrl(fbUrl)?'rgba(239,68,68,.3)':'rgba(255,170,0,.15)'}`, borderRadius:10, padding:'12px 14px', marginBottom:14}}>
                <div style={{fontSize:11,color:'#fbbf24',fontWeight:600,marginBottom:8}}>🔥 FIREBASE — DEILING MILLI TÆKJA</div>
                {fbUrl&&!isValidFbUrl(fbUrl)
                  ?<div style={{fontSize:12,color:C.red,lineHeight:1.6}}>
                    ⚠️ Þessi slóð er ekki rétt — hún lítur út eins og Firebase <b>Console</b>-slóðin (þar sem þú stjórnar verkefninu), ekki gagnagrunns-slóðin sjálf sem appið þarf.<br/><br/>
                    Farðu í Console → <b>Realtime Database → flipinn "Data"</b> — rétta slóðin birtist efst, og hún endar á <code style={{background:'#222',padding:'1px 4px',borderRadius:3}}>.firebaseio.com</code> eða <code style={{background:'#222',padding:'1px 4px',borderRadius:3}}>.firebasedatabase.app</code>
                  </div>
                  :fbUrl
                  ?<div style={{fontSize:12,color:C.grn,display:'flex',alignItems:'center',gap:6}}><ICheck s={13} c={C.grn}/> Virkur — hakarnir deila sér á milli allra tækja</div>
                  :<div style={{fontSize:12,color:'#888',lineHeight:1.7}}>
                    Ókeypis, ótakmarkaðar beiðnir. Bara þörf á einum URL.<br/>
                    1. <b style={{color:'#fbbf24'}}>console.firebase.google.com</b> → Add project<br/>
                    2. Build → Realtime Database → Create database<br/>
                    3. Veldu "Start in test mode" → Enable<br/>
                    4. Á "Data" flipanum — afritaðu slóðina EFST á síðunni (t.d. https://xxx-default-rtdb.firebaseio.com) — EKKI slóðina úr vafranum þínum<br/>
                    5. Límdu hér:
                  </div>
                }
              </div>
              <Field label="Firebase Database URL" value={settFbUrl} onChange={setSettFbUrl} placeholder={fbUrl||'https://your-project-default-rtdb.firebaseio.com'} mono small/>
              {settFbUrl&&!isValidFbUrl(settFbUrl)&&<div style={{fontSize:11,color:C.red,marginTop:-8,marginBottom:8}}>⚠️ Þetta lítur ekki út eins og rétt Firebase gagnagrunns-slóð</div>}

              <div style={{height:1,background:C.bd,margin:'8px 0 14px'}}/>

              {/* Web3Forms */}
              <div style={{background:'rgba(34,197,94,.06)',border:`1px solid rgba(34,197,94,.15)`,borderRadius:10,padding:'12px 14px',marginBottom:14}}>
                <div style={{fontSize:11,color:C.grn,fontWeight:600,marginBottom:4}}>WEB3FORMS (tölvupóstlykill)</div>
                {web3Key?<div style={{fontSize:12,color:C.grn,display:'flex',alignItems:'center',gap:6}}><ICheck s={13} c={C.grn}/> Virkur</div>:<div style={{fontSize:12,color:'#888'}}>web3forms.com → settu inn bl.froskur@gmail.com → "Create Access Key"</div>}
              </div>
              <Field label="Web3Forms lykill" value={settW3} onChange={setSettW3} placeholder={web3Key?'•••••••••':'xxxxxxxx-xxxx-...'} small/>

              <div style={{height:1,background:C.bd,margin:'8px 0 14px'}}/>

              {/* imgbb — for photo suggestions (Web3Forms free tier has no attachments) */}
              <div style={{background:'rgba(168,85,247,.06)',border:`1px solid rgba(168,85,247,.15)`,borderRadius:10,padding:'12px 14px',marginBottom:14}}>
                <div style={{fontSize:11,color:'#c084fc',fontWeight:600,marginBottom:4}}>IMGBB (myndir í vöru-tillögum)</div>
                {imgbbKey
                  ?<div style={{fontSize:12,color:C.grn,display:'flex',alignItems:'center',gap:6}}><ICheck s={13} c={C.grn}/> Virkur</div>
                  :<div style={{fontSize:12,color:'#888',lineHeight:1.5}}>Web3Forms ókeypis áætlunin styður ekki viðhengi.<br/>api.imgbb.com → "Get API Key" → afritaðu</div>}
              </div>
              <Field label="imgbb lykill" value={settImgbb} onChange={setSettImgbb} placeholder={imgbbKey?'•••••••••':'a1b2c3...'} small/>

              <div style={{height:1,background:C.bd,margin:'8px 0 14px'}}/>

              {/* Flokkar */}
              <div style={{fontSize:11,color:C.mut,letterSpacing:1,textTransform:'uppercase',marginBottom:6}}>Flokkar</div>
              <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:8}}>
                {CATS.map(c=><span key={c} style={{fontSize:11,padding:'4px 9px',borderRadius:10,background:C.s2,border:`1px solid ${C.bd}`,color:C.txt}}>{c}</span>)}
              </div>
              <Field value={newCatName} onChange={setNewCatName} placeholder="Nýr flokkur, t.d. Verkfæri"
                action={{label:saving?'...':'Bæta við',fn:addCategory}}/>

              <div style={{height:1,background:C.bd,margin:'8px 0 14px'}}/>

              {/* Birgjar */}
              <div style={{fontSize:11,color:C.mut,letterSpacing:1,textTransform:'uppercase',marginBottom:6}}>Birgjar</div>
              <div style={{display:'flex',flexDirection:'column',gap:4,marginBottom:8,maxHeight:120,overflowY:'auto'}}>
                {SUPS_LIST.map(s=>(
                  <div key={s} style={{display:'flex',justifyContent:'space-between',fontSize:11,padding:'5px 9px',borderRadius:8,background:C.s2,border:`1px solid ${C.bd}`}}>
                    <span style={{color:C.txt,fontWeight:500}}>{s}</span>
                    <span style={{color:C.mut,fontFamily:"'Fira Code',monospace"}}>{SUPS_MAP[s]||'—'}</span>
                  </div>
                ))}
              </div>
              <Field value={newSupName} onChange={setNewSupName} placeholder="Nafn birgja, t.d. Bílanaust"/>
              <Field value={newSupEmail} onChange={setNewSupEmail} placeholder="Netfang birgja (valfrjálst)" mono
                action={{label:saving?'...':'Bæta við',fn:addSupplier}}/>

              <div style={{height:1,background:C.bd,margin:'8px 0 14px'}}/>

              {/* GitHub token */}
              <Field label="GitHub token (til að breyta vörum)" value={ghToken} onChange={v=>{setGhToken(v);localStorage.setItem('vrkst-token',v);}} placeholder="ghp_xxxxxxxxxxxx" mono small
                hint={ghToken?'✓ Virkur':'github.com → Settings → Developer settings → Tokens (classic) → repo scope'}/>

              <button onClick={()=>{setModal('bulkImport');}} className="tap" style={{width:'100%',padding:11,borderRadius:10,border:`1px solid ${C.bd}`,background:C.s2,color:C.txt,fontSize:13,fontWeight:600,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:7,fontFamily:'inherit',marginTop:10}}>
                <IUpload s={14} c={C.acc}/> Flytja inn margar vörur (CSV úr Excel)
              </button>

              {/* Save all to config.json */}
              {(settW3||settImgbb||settFbUrl)&&(
                <button onClick={()=>{
                  if(settFbUrl&&!isValidFbUrl(settFbUrl)){
                    showToast('⚠️ Firebase slóðin er ekki rétt — sjá leiðbeiningar að ofan');
                    return;
                  }
                  saveConfig({w3:settW3,imgbb:settImgbb,fbUrl:settFbUrl});
                }} disabled={saving||!ghToken} className="tap"
                  style={{width:'100%',padding:12,borderRadius:10,border:'none',background:ghToken?C.acc:'#333',color:'#fff',fontSize:13,fontWeight:600,cursor:ghToken?'pointer':'default',display:'flex',alignItems:'center',justifyContent:'center',gap:7,fontFamily:'inherit',marginTop:4}}>
                  {saving?<IRefresh s={14} c="#fff" cls="spin"/>:<ICheck s={14} c="#fff"/>}
                  {saving?'Vista...':'Vista á GitHub (allir uppfærðir)'}
                </button>
              )}
            </>
          )}
        </Sheet>
      )}

      {/* ADD ITEM */}
      {modal==='addItem'&&(
        <Sheet onClose={()=>setModal(null)} z={210}>
          <div style={{fontWeight:700,fontSize:17,marginBottom:16}}>Bæta við vöru</div>
          <Field label="Nafn vöru *" value={newItem.name} onChange={v=>setNewItem(p=>({...p,name:v}))} placeholder="t.d. WD-40 sprey"/>
          <Field label="Vörunúmer (SKU)" value={newItem.sku} onChange={v=>setNewItem(p=>({...p,sku:v}))} placeholder="t.d. wd40-400" mono/>
          <div style={{marginBottom:12}}>
            <div style={{fontSize:11,color:C.mut,letterSpacing:1,textTransform:'uppercase',marginBottom:4}}>Flokkur</div>
            <div style={{display:'flex',gap:8}}>
              {CATS.map(c=><button key={c} onClick={()=>setNewItem(p=>({...p,cat:c}))} className="tap" style={{flex:1,padding:'8px',borderRadius:8,border:`1px solid ${newItem.cat===c?C.acc:C.bd}`,background:newItem.cat===c?'rgba(232,93,4,.12)':'transparent',color:newItem.cat===c?C.acc:C.mut,fontSize:13,cursor:'pointer',fontFamily:'inherit'}}>{c}</button>)}
            </div>
          </div>
          <div style={{marginBottom:12}}>
            <div style={{fontSize:11,color:C.mut,letterSpacing:1,textTransform:'uppercase',marginBottom:4}}>Birgir</div>
            <select value={newItem.sup} onChange={e=>setNewItem(p=>({...p,sup:e.target.value}))} style={{width:'100%',background:C.s2,border:`1px solid ${C.bd}`,borderRadius:8,padding:'10px 12px',color:C.txt,fontSize:14,fontFamily:'inherit',outline:'none'}}>
              {SUPS_LIST.map(s=><option key={s} value={s}>{s}</option>)}
            </select>
          </div>
          <Field label="Pöntunarmagn *" value={newItem.qty} onChange={v=>setNewItem(p=>({...p,qty:v}))} placeholder="t.d. 2 brúsar"/>
          <div style={{display:'flex',gap:8}}>
            <button onClick={()=>setModal(null)} className="tap" style={{flex:1,padding:12,borderRadius:10,border:`1px solid ${C.bd}`,background:'none',color:C.mut,fontSize:13,cursor:'pointer',fontFamily:'inherit'}}>Hætta við</button>
            <button onClick={addItem} disabled={saving||!newItem.name||!newItem.qty} className="tap" style={{flex:2,padding:12,borderRadius:10,border:'none',background:newItem.name&&newItem.qty?C.acc:'#333',color:'#fff',fontSize:13,fontWeight:600,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:6,fontFamily:'inherit'}}>
              {saving?<IRefresh s={14} c="#fff" cls="spin"/>:<IPlus s={14} c="#fff"/>}{saving?'Vista...':'Bæta við'}
            </button>
          </div>
        </Sheet>
      )}

      {/* BULK IMPORT (CSV) */}
      {modal==='bulkImport'&&(
        <Sheet onClose={()=>{setModal(null);setBulkPreview(null);}} z={210}>
          <div style={{fontWeight:700,fontSize:17,marginBottom:4}}>Flytja inn margar vörur</div>
          <div style={{fontSize:12,color:C.mut,marginBottom:16,lineHeight:1.5}}>Búðu til lista í Excel með dálkunum <b>Nafn, VNR, Birgir, Flokkur, Magn</b> (röð skiptir ekki máli), vistaðu sem CSV og hlaðaðu upp hér.</div>

          <button onClick={downloadCSVTemplate} className="tap" style={{width:'100%',padding:10,borderRadius:8,border:`1px solid ${C.bd}`,background:C.s2,color:C.txt,fontSize:12,fontWeight:600,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:6,fontFamily:'inherit',marginBottom:14}}>
            <IDownload s={13} c={C.txt}/> Sækja sniðmát (Excel/CSV)
          </button>

          {!bulkPreview&&(
            <>
              <input id="bulkFileInput" type="file" accept=".csv,text/csv" style={{display:'none'}} onChange={onBulkFile}/>
              <label htmlFor="bulkFileInput" className="tap" style={{width:'100%',padding:11,borderRadius:8,border:`1px dashed ${C.bd}`,background:'transparent',color:C.mut,fontSize:13,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:7,fontFamily:'inherit',marginBottom:10}}>
                <IUpload s={14} c={C.mut}/> Velja CSV skrá
              </label>
              <div style={{fontSize:11,color:C.mut,letterSpacing:1,textTransform:'uppercase',marginBottom:4}}>Eða líma CSV-texta beint</div>
              <textarea value={bulkText} onChange={e=>setBulkText(e.target.value)} rows={6} placeholder="Nafn;VNR;Birgir;Flokkur;Magn&#10;WD-40 sprey;wd40-400;Kemi;Efnavörur;2 stk"
                style={{width:'100%',background:C.s2,border:`1px solid ${C.bd}`,borderRadius:8,padding:'10px 12px',color:C.txt,fontSize:12,fontFamily:"'Fira Code',monospace",outline:'none',resize:'vertical',marginBottom:14}}/>
              <div style={{display:'flex',gap:8}}>
                <button onClick={()=>{setModal(null);setBulkText('');}} className="tap" style={{flex:1,padding:12,borderRadius:10,border:`1px solid ${C.bd}`,background:'none',color:C.mut,fontSize:13,cursor:'pointer',fontFamily:'inherit'}}>Hætta við</button>
                <button onClick={previewBulkImport} className="tap" style={{flex:2,padding:12,borderRadius:10,border:'none',background:C.acc,color:'#fff',fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>Forskoða</button>
              </div>
            </>
          )}

          {bulkPreview&&(
            <>
              <div style={{background:'rgba(34,197,94,.08)',border:`1px solid rgba(34,197,94,.2)`,borderRadius:10,padding:'12px 14px',marginBottom:12}}>
                <div style={{fontSize:13,color:C.grn,fontWeight:700,marginBottom:4}}>{bulkPreview.items.length} vörur fundust</div>
                {bulkPreview.newCats.length>0&&<div style={{fontSize:12,color:'#fbbf24',marginTop:4}}>+ {bulkPreview.newCats.length} nýir flokkar: {bulkPreview.newCats.join(', ')}</div>}
                {bulkPreview.newSups.length>0&&<div style={{fontSize:12,color:'#c084fc',marginTop:4}}>+ {bulkPreview.newSups.length} nýir birgjar: {bulkPreview.newSups.join(', ')}</div>}
              </div>
              <div style={{maxHeight:200,overflowY:'auto',background:C.bg,border:`1px solid ${C.bd}`,borderRadius:10,padding:'8px 12px',marginBottom:14}}>
                {bulkPreview.items.slice(0,50).map((it,i)=>(
                  <div key={i} style={{fontSize:12,color:C.txt,padding:'5px 0',borderBottom:i<bulkPreview.items.length-1?`1px solid ${C.bd}`:'none'}}>
                    {it.name} <span style={{color:C.mut}}>· {it.sup} · {it.cat} · {it.qty}</span>
                  </div>
                ))}
                {bulkPreview.items.length>50&&<div style={{fontSize:11,color:C.mut,padding:'6px 0'}}>...og {bulkPreview.items.length-50} til viðbótar</div>}
              </div>
              <div style={{display:'flex',gap:8}}>
                <button onClick={()=>setBulkPreview(null)} className="tap" style={{flex:1,padding:12,borderRadius:10,border:`1px solid ${C.bd}`,background:'none',color:C.mut,fontSize:13,cursor:'pointer',fontFamily:'inherit'}}>Til baka</button>
                <button onClick={confirmBulkImport} disabled={bulkImporting||!ghToken} className="tap" style={{flex:2,padding:12,borderRadius:10,border:'none',background:ghToken?C.acc:'#333',color:'#fff',fontSize:13,fontWeight:600,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:6,fontFamily:'inherit'}}>
                  {bulkImporting?<IRefresh s={14} c="#fff" cls="spin"/>:<IUpload s={14} c="#fff"/>}
                  {bulkImporting?'Flyt inn...':`Flytja inn ${bulkPreview.items.length} vörur`}
                </button>
              </div>
              {!ghToken&&<div style={{fontSize:11,color:C.red,marginTop:8}}>GitHub token vantar — settu inn hér að ofan í stillingum fyrst</div>}
            </>
          )}
        </Sheet>
      )}

      {/* EDIT ITEM */}
      {editItem&&(
        <Sheet onClose={()=>setEditItem(null)} z={210}>
          <div style={{fontWeight:700,fontSize:17,marginBottom:16}}>Breyta vöru</div>
          <Field label="Nafn *" value={editItem.name} onChange={v=>setEditItem(p=>({...p,name:v}))} placeholder="Nafn vöru"/>
          <Field label="Vörunúmer" value={editItem.sku||''} onChange={v=>setEditItem(p=>({...p,sku:v}))} placeholder="VNR" mono/>
          <div style={{marginBottom:12}}>
            <div style={{fontSize:11,color:C.mut,letterSpacing:1,textTransform:'uppercase',marginBottom:4}}>Flokkur</div>
            <div style={{display:'flex',gap:8}}>{CATS.map(c=><button key={c} onClick={()=>setEditItem(p=>({...p,cat:c}))} className="tap" style={{flex:1,padding:'8px',borderRadius:8,border:`1px solid ${editItem.cat===c?C.acc:C.bd}`,background:editItem.cat===c?'rgba(232,93,4,.12)':'transparent',color:editItem.cat===c?C.acc:C.mut,fontSize:13,cursor:'pointer',fontFamily:'inherit'}}>{c}</button>)}</div>
          </div>
          <div style={{marginBottom:12}}>
            <div style={{fontSize:11,color:C.mut,letterSpacing:1,textTransform:'uppercase',marginBottom:4}}>Birgir</div>
            <select value={editItem.sup} onChange={e=>setEditItem(p=>({...p,sup:e.target.value}))} style={{width:'100%',background:C.s2,border:`1px solid ${C.bd}`,borderRadius:8,padding:'10px 12px',color:C.txt,fontSize:14,fontFamily:'inherit',outline:'none'}}>
              {SUPS_LIST.map(s=><option key={s} value={s}>{s}</option>)}
            </select>
          </div>
          <Field label="Magn *" value={editItem.qty} onChange={v=>setEditItem(p=>({...p,qty:v}))} placeholder="t.d. 2 brúsar"/>
          <div style={{display:'flex',gap:8}}>
            <button onClick={()=>setEditItem(null)} className="tap" style={{flex:1,padding:12,borderRadius:10,border:`1px solid ${C.bd}`,background:'none',color:C.mut,fontSize:13,cursor:'pointer',fontFamily:'inherit'}}>Hætta við</button>
            <button onClick={saveEdit} disabled={saving} className="tap" style={{flex:2,padding:12,borderRadius:10,border:'none',background:C.acc,color:'#fff',fontSize:13,fontWeight:600,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:6,fontFamily:'inherit'}}>
              {saving?<IRefresh s={14} c="#fff" cls="spin"/>:<ICheck s={14} c="#fff"/>}{saving?'Vista...':'Vista'}
            </button>
          </div>
        </Sheet>
      )}

      {/* DELETE */}
      {delId&&(
        <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,.87)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:220,padding:24}}>
          <div className="pop" style={{background:C.s1,borderRadius:18,padding:'28px 24px',border:`1px solid ${C.bd}`,width:'100%',maxWidth:340,textAlign:'center'}}>
            <ITrash s={32} c={C.red} st={{marginBottom:14}}/>
            <div style={{fontWeight:700,fontSize:17,marginBottom:8}}>Eyða vöru?</div>
            <div style={{fontSize:13,color:C.mut,marginBottom:24,lineHeight:1.5}}>{items.find(i=>i.id===delId)?.name||''}<br/>Þetta er óafturkræft.</div>
            <div style={{display:'flex',gap:10}}>
              <button onClick={()=>setDelId(null)} className="tap" style={{flex:1,padding:12,borderRadius:10,border:`1px solid ${C.bd}`,background:'none',color:C.txt,fontSize:14,cursor:'pointer',fontFamily:'inherit'}}>Hætta við</button>
              <button onClick={()=>deleteItem(delId)} disabled={saving} className="tap" style={{flex:1,padding:12,borderRadius:10,border:'none',background:C.red,color:'#fff',fontSize:14,fontWeight:600,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:6,fontFamily:'inherit'}}>
                {saving&&<IRefresh s={14} c="#fff" cls="spin"/>}Eyða
              </button>
            </div>
          </div>
        </div>
      )}

      {/* CLEAR ORDER CONFIRM — spyr hvort vista eigi í sögu fyrst */}
      {clearConfirm&&(
        <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,.87)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:220,padding:24}}>
          <div className="pop" style={{background:C.s1,borderRadius:18,padding:'26px 22px',border:`1px solid ${C.bd}`,width:'100%',maxWidth:340,textAlign:'center'}}>
            <IClock s={30} c={C.amb} st={{marginBottom:12}}/>
            <div style={{fontWeight:700,fontSize:16,marginBottom:8}}>Vista í sögu áður en hreinsað er?</div>
            <div style={{fontSize:13,color:C.mut,marginBottom:22,lineHeight:1.5}}>{count} vörur eru á listanum núna.</div>
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              <button onClick={async()=>{ await saveToHistoryFromChecked(); await clearOrder(); setClearConfirm(false); }} className="tap"
                style={{padding:12,borderRadius:10,border:'none',background:C.acc,color:'#fff',fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>
                Vista í sögu og hreinsa
              </button>
              <button onClick={async()=>{ await clearOrder(); setClearConfirm(false); }} className="tap"
                style={{padding:12,borderRadius:10,border:`1px solid ${C.bd}`,background:'none',color:C.txt,fontSize:13,cursor:'pointer',fontFamily:'inherit'}}>
                Bara hreinsa (ekki vista)
              </button>
              <button onClick={()=>setClearConfirm(false)} className="tap"
                style={{padding:10,borderRadius:10,border:'none',background:'none',color:C.mut,fontSize:12,cursor:'pointer',fontFamily:'inherit'}}>
                Hætta við
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ITEM STATS — hversu oft vara hefur verið pöntuð */}
      {statsItem&&(
        <Sheet onClose={()=>setStatsItem(null)}>
          <div style={{fontWeight:700,fontSize:17,marginBottom:2}}>{statsItem.item.name}</div>
          <div style={{fontSize:11,color:C.mut,fontFamily:"'Fira Code',monospace",marginBottom:18}}>{statsItem.item.sku?`#${statsItem.item.sku}`:'Ekkert vörunúmer'}</div>
          {[{label:'Síðustu 3 mánuði',m:3},{label:'Síðustu 6 mánuði',m:6},{label:'Síðasta árið',m:12}].map(p=>(
            <div key={p.m} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'12px 4px',borderBottom:`1px solid ${C.bd}`}}>
              <span style={{fontSize:14,color:C.txt}}>{p.label}</span>
              <span style={{fontSize:16,fontWeight:700,color:C.acc}}>{countOrders(statsItem.entries,statsItem.item,p.m)}× pantað</span>
            </div>
          ))}
          <div style={{fontSize:11,color:'#555',marginTop:14,lineHeight:1.5}}>Byggt á fjölda skráðra pöntunarfærslna í sögunni sem innihalda þessa vöru.</div>
        </Sheet>
      )}


      {/* PHOTO */}
      {modal==='photo'&&(
        <div onClick={()=>!photoSending&&resetPhoto()} style={{position:'absolute',inset:0,background:'rgba(0,0,0,.87)',display:'flex',flexDirection:'column',justifyContent:'flex-end',zIndex:200}}>
          <div onClick={e=>e.stopPropagation()} className="sheet" style={{background:C.s1,borderRadius:'18px 18px 0 0',padding:'20px 16px 38px',border:`1px solid ${C.bd}`}}>
            <div style={{width:36,height:4,background:'#333',borderRadius:2,margin:'0 auto 16px'}}/>
            <div style={{fontWeight:700,fontSize:17,marginBottom:4}}>Senda inn tillögu af vöru</div>
            <div style={{fontSize:12,color:C.mut,marginBottom:14}}>{userName} → {adminName}</div>
            {photoPreview&&<div style={{position:'relative',marginBottom:12}}>
              <img src={photoPreview} alt="preview" style={{width:'100%',borderRadius:10,maxHeight:200,objectFit:'cover'}}/>
              <button onClick={()=>photoRef.current&&photoRef.current.click()} className="tap" style={{position:'absolute',bottom:8,right:8,background:'rgba(0,0,0,.7)',border:'none',borderRadius:8,padding:'6px 10px',color:'#fff',fontSize:11,cursor:'pointer',display:'flex',alignItems:'center',gap:5,fontFamily:'inherit'}}><ICamera s={12} c="#fff"/> Önnur mynd</button>
            </div>}
            <div style={{marginBottom:14}}>
              <div style={{fontSize:11,color:C.mut,letterSpacing:1,textTransform:'uppercase',marginBottom:4}}>Lýsing</div>
              <textarea value={photoDesc} onChange={e=>setPhotoDesc(e.target.value)} placeholder="Hvað er þetta? Hvar er það notað?" rows={3} style={{width:'100%',background:C.s2,border:`1px solid ${C.bd}`,borderRadius:8,padding:'10px 12px',color:C.txt,fontSize:14,fontFamily:'inherit',outline:'none',resize:'none'}}/>
            </div>
            {photoErr&&<div style={{fontSize:12,color:C.red,marginBottom:12}}>{photoErr}</div>}
            <div style={{display:'flex',gap:8}}>
              <button onClick={resetPhoto} disabled={photoSending} className="tap" style={{flex:1,padding:12,borderRadius:10,border:`1px solid ${C.bd}`,background:'none',color:C.mut,fontSize:13,cursor:'pointer',fontFamily:'inherit',opacity:photoSending?.5:1}}>Hætta við</button>
              <button onClick={sendPhoto} disabled={photoSending} className="tap" style={{flex:2,padding:12,borderRadius:10,border:'none',background:C.acc,color:'#fff',fontSize:13,fontWeight:600,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:7,fontFamily:'inherit',opacity:photoSending?.7:1}}>
                {photoSending?<IRefresh s={14} c="#fff" cls="spin"/>:<ICamera s={14} c="#fff"/>}{photoSending?'Sendi...':'Senda tillögu'}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ORDER SHARE */}
      {orderShare&&(
        <Sheet onClose={()=>{setOrderShare(null);setOrderRefNum('');}}>
          <div style={{fontWeight:700,fontSize:17,marginBottom:3}}>Senda yfirlit</div>
          <div style={{fontSize:12,color:C.mut,marginBottom:2}}>Stinga upp á að senda á:</div>
          <div style={{fontSize:13,color:C.acc,fontWeight:600,fontFamily:"'Fira Code',monospace",marginBottom:12}}>{orderShare.to}</div>
          <div style={{background:C.bg,borderRadius:10,padding:'10px 12px',fontSize:11,fontFamily:"'Fira Code',monospace",color:'#888',maxHeight:200,overflowY:'auto',marginBottom:14,whiteSpace:'pre-wrap',border:`1px solid ${C.bd}`,lineHeight:1.6}}>{orderShare.body}</div>

          <div style={{background:'rgba(245,158,11,.08)',border:`1px solid rgba(245,158,11,.2)`,borderRadius:10,padding:'10px 12px',marginBottom:14}}>
            <div style={{fontSize:11,color:C.amb,fontWeight:600,marginBottom:6}}>💡 Mundu að setja inn beiðnanúmer áður en nýtt tölvupóstur er stofnaður</div>
            <input value={orderRefNum} onChange={e=>setOrderRefNum(e.target.value)} placeholder="t.d. PO-1042"
              style={{width:'100%',background:C.s2,border:`1px solid ${C.bd}`,borderRadius:8,padding:'8px 10px',color:C.txt,fontSize:13,fontFamily:"'Fira Code',monospace",outline:'none'}}/>
          </div>

          <button onClick={()=>{
            const subj = orderRefNum ? `${orderRefNum} — ${orderShare.subject}` : orderShare.subject;
            const full = `Til: ${orderShare.to}\nEfni: ${subj}\n\n${orderShare.body}`;
            navigator.clipboard.writeText(full).then(()=>showToast('✓ Afritað — límdu inn í nýjan tölvupóst')).catch(()=>showToast('Gat ekki afritað'));
          }} className="tap" style={{width:'100%',padding:14,borderRadius:12,border:'none',background:C.acc,color:'#fff',fontSize:14,fontWeight:600,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:8,fontFamily:'inherit'}}>
            <ICopy s={16} c="#fff"/> Afrita fyrir tölvupóst
          </button>
        </Sheet>
      )}

      {/* NOTIFICATION SUCCESS — með flugeldum 🎉 */}
      {notifDone&&(
        <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,.93)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:250,padding:24,overflow:'hidden'}}>
          <canvas ref={confettiRef} style={{position:'absolute',inset:0,width:'100%',height:'100%',pointerEvents:'none'}}/>
          <div className="pop" style={{background:C.s1,borderRadius:24,padding:'44px 28px',border:`1px solid ${C.bd}`,textAlign:'center',width:'100%',maxWidth:340,position:'relative',zIndex:2}}>
            <div style={{fontSize:60,marginBottom:16}}>🎉</div>
            <div style={{fontFamily:'Oxanium,sans-serif',fontSize:22,fontWeight:700,color:C.grn,marginBottom:14}}>Tilkynning send! 😊</div>
            <div style={{fontSize:15,color:C.txt,lineHeight:1.6,marginBottom:16}}>
              <span style={{color:C.acc,fontWeight:700}}>{adminName}</span> hefur fengið tilkynningu um að panta vörur
            </div>
            <div style={{background:'rgba(232,93,4,.08)',border:`1px solid rgba(232,93,4,.2)`,borderRadius:12,padding:'14px 16px',marginBottom:24}}>
              <div style={{fontSize:14,color:C.acc,fontWeight:600,lineHeight:1.5}}>{hvatning}</div>
            </div>
            <button onClick={()=>setNotifDone(false)} className="tap"
              style={{width:'100%',padding:14,borderRadius:12,border:'none',background:C.acc,color:'#fff',fontSize:15,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>
              Allt í lagi 👍
            </button>
          </div>
        </div>
      )}

      {/* TOAST */}
      {toast&&<div className="anim" style={{position:'absolute',bottom:72,left:'50%',transform:'translateX(-50%)',background:'#1e1e1e',border:`1px solid ${C.bd}`,borderRadius:20,padding:'7px 16px',fontSize:12,color:C.txt,whiteSpace:'nowrap',boxShadow:'0 4px 20px rgba(0,0,0,.5)',zIndex:300,pointerEvents:'none'}}>{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
