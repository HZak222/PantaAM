//  Hjálparföll
// ═══════════════════════════════════════════════════════════════

function norm(s) {
  return (s||"").toLowerCase()
    .replace(/[áä]/g,"a").replace(/[éê]/g,"e").replace(/[íî]/g,"i")
    .replace(/[óö]/g,"o").replace(/[úü]/g,"u").replace(/ý/g,"y")
    .replace(/ð/g,"d").replace(/þ/g,"th").replace(/æ/g,"ae");
}

function hits(item, q) {
  if (!q) return true;
  const words = norm(q).split(/\s+/).filter(Boolean);
  const hay   = norm(`${item.name} ${item.sku} ${item.sup}`);
  return words.every(w => hay.includes(w));
}

function grp(arr, key) {
  return arr.reduce((g,x) => { (g[x[key]]=g[x[key]]||[]).push(x); return g; }, {});
}

    const r = new SR(); r.lang="is-IS";
    r.onstart  = () => setListening(true);
    r.onend    = () => setListening(false);
    r.onerror  = () => setListening(false);
    r.onresult = e => { setQuery(e.results[0][0].transcript); setAllCats(false); };
    r.start();
  };

  const crossSearch = () => { if(!query) return; setAllCats(true); setSupF(""); showToast("Leitar í öllum flokkum..."); };
  const clearSearch = () => { setQuery(""); setSupF(""); setAllCats(false); };

  // ── Tölvupóstur ─────────────────────────────────────────────
  const sendEmail = (supName=null) => {
    const items = supName ? checkedList.filter(i=>i.sup===supName) : checkedList;
    if (!items.length) return;
    const to  = supName ? (SUPPLIER_EMAILS[supName]||MANAGER_EMAIL) : MANAGER_EMAIL;
    const dt  = new Date().toLocaleDateString("is-IS");
    const sub = encodeURIComponent(supName
      ? `Pöntun ${dt} – ${items.length} vörur`
      : `Pöntunaryfirlit ${dt} – ${count} vörur`);
    let body  = supName ? "Hæ,\n\nVið viljum panta eftirfarandi:\n\n"
                        : `Pöntunaryfirlit – ${dt}\n\n`;
    const gs = grp(items,"sup");
    Object.entries(gs).forEach(([s,its]) => {
      if(!supName) body+=`── ${s} ──\n`;
      its.forEach(i => { body+=`• ${i.name}`; if(i.sku) body+=` (VNR: ${i.sku})`; body+=` — ${i.qty}\n`; });
      body+="\n";
    });
    body += supName ? "\nKveðja,\nVerkstæðið" : "\nSent frá Verkstæðinu";
    window.location.href = `mailto:${to}?subject=${sub}&body=${encodeURIComponent(body)}`;
  };

  const Divider = ({label}) => (
    <div style={{display:"flex",alignItems:"center",padding:"8px 16px 2px",gap:8}}>
      <div style={{height:1,flex:1,background:C.bd}}/>
      <span style={{fontSize:10,color:C.mut,letterSpacing:2,textTransform:"uppercase",fontWeight:600}}>{label}</span>
      <div style={{height:1,flex:1,background:C.bd}}/>
    </div>
  );

  // ── Útlitið ─────────────────────────────────────────────────
  return (
    <div style={{background:C.bg,color:C.txt,height:"100%",maxWidth:480,margin:"0 auto",
                 display:"flex",flexDirection:"column",overflow:"hidden"}}>

      {/* Header */}
      <div style={{padding:"14px 16px 10px",borderBottom:`1px solid ${C.bd}`,flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
          <div>
            <div style={{fontFamily:"Oxanium,sans-serif",fontSize:25,fontWeight:700,color:C.acc,letterSpacing:1,lineHeight:1}}>
              VERKSTÆÐIÐ
            </div>
            <div style={{fontSize:10,color:C.mut,letterSpacing:2,textTransform:"uppercase",marginTop:2}}>
              Efnalager · Pöntunarkerfi
            </div>
          </div>
          {count>0 && (
            <div style={{background:C.acc,color:"#fff",borderRadius:20,padding:"4px 11px",
                         fontSize:13,fontWeight:600,display:"flex",alignItems:"center",gap:5}}>
              <ICart s={13} c="#fff"/> {count}
            </div>
          )}
        </div>

        {/* Leitarsvæði */}
        <div style={{display:"flex",gap:6}}>
          <div style={{flex:1,display:"flex",alignItems:"center",background:C.s1,
                       border:`1px solid ${C.bd}`,borderRadius:10,padding:"8px 10px",gap:7}}>
            <ISearch s={14} c={C.mut}/>
            <input value={query}
              onChange={e=>{setQuery(e.target.value);setAllCats(false);}}
              onKeyDown={e=>e.key==="Enter"&&crossSearch()}
              placeholder="Leita að vöru eða vörunúmeri..."
              style={{flex:1,background:"none",border:"none",outline:"none",color:C.txt,fontSize:14,fontFamily:"inherit"}}/>
            {query && (
              <button onClick={clearSearch} className="tap"
                style={{background:"none",border:"none",color:C.mut,cursor:"pointer",padding:0,display:"flex"}}>
                <IX s={13} c={C.mut}/>
              </button>
            )}
          </div>
          <button onClick={startVoice} className={`tap${listening?" puls":""}`} style={{
            width:38,height:38,borderRadius:10,border:"none",cursor:"pointer",
            background:listening?C.acc:C.s1,display:"flex",alignItems:"center",justifyContent:"center"}}>
            <IMic s={15} c={listening?"#fff":C.mut}/>
          </button>
          <button onClick={crossSearch} disabled={!query} className="tap" style={{
            width:38,height:38,borderRadius:10,cursor:query?"pointer":"default",
            border:`1px solid ${allCats?"#2d4d1e":C.bd}`,
            background:allCats?"#1a2e12":C.s1,
            display:"flex",alignItems:"center",justifyContent:"center",opacity:query?1:.35}}>
            <IZap s={14} c={C.acc}/>
          </button>
        </div>

        {allCats && (
          <div className="anim" style={{marginTop:5,fontSize:11,color:"#4ade80",display:"flex",alignItems:"center",gap:5}}>
            <IZap s={10} c="#4ade80"/>
            Leitar í öllum flokkum · {visible.length} niðurstöður
            <button onClick={()=>setAllCats(false)}
              style={{background:"none",border:"none",color:C.mut,cursor:"pointer",fontSize:11,padding:0,marginLeft:4}}>
              hreinsa
            </button>
          </div>
        )}
      </div>

      {/* Flokkarar */}
      {view==="list" && (
        <div style={{padding:"8px 16px",borderBottom:`1px solid ${C.bd}`,flexShrink:0}}>
          <div style={{display:"flex",gap:6,marginBottom:7}}>
            {["Efnavörur","Perur"].map(c=>(
              <button key={c} className="tap"
                onClick={()=>{setCat(c);setSupF("");setAllCats(false);}}
                style={{padding:"5px 13px",borderRadius:20,border:"none",
                        background:cat===c&&!allCats?C.acc:C.s2,
                        color:cat===c&&!allCats?"#fff":C.mut,
                        fontSize:12,fontWeight:500,cursor:"pointer",
                        display:"flex",alignItems:"center",gap:5}}>
                {c==="Efnavörur"
                  ? <IBox  s={11} c={cat===c&&!allCats?"#fff":C.mut}/>
                  : <IBulb s={11} c={cat===c&&!allCats?"#fff":C.mut}/>}
                {c}
              </button>
            ))}
          </div>
          {!allCats && (
            <div className="hscroll">
              {["", ...suppliers].map(s=>(
                <button key={s||"all"} className="tap"
                  onClick={()=>setSupF(supF===s?"":s)}
                  style={{padding:"3px 9px",borderRadius:12,fontSize:11,whiteSpace:"nowrap",
                          fontFamily:"inherit",cursor:"pointer",
                          border:`1px solid ${supF===s?C.acc:C.bd}`,
                          background:supF===s?"rgba(232,93,4,.12)":"transparent",
                          color:supF===s?C.acc:C.mut}}>
                  {s||"Allar"}
                </button>
              ))}
            </div>
          )}
        </div>
      )}

      {/* Skrunsvæði */}
      <div style={{flex:1,overflowY:"auto"}}>

        {/* ═══ Lagerlisti ═══ */}
        {view==="list" && (
          <>
            {Object.keys(grouped).length===0
              ? (
                <div style={{textAlign:"center",padding:"60px 20px",color:C.mut}}>
                  <IBox s={40} c={C.mut} style={{opacity:.15}}/>
                  <div style={{fontSize:15,marginTop:12}}>Engar vörur fundust</div>
                  <div style={{fontSize:12,marginTop:5}}>Prófaðu ⚡ til að leita í öllum flokkum</div>
                </div>
              )
              : Object.entries(grouped).map(([sup,items])=>(
                <div key={sup}>
                  <Divider label={sup}/>
                  {items.map(item=>(
                    <div key={item.id} className="tap" onClick={()=>toggle(item.id)}
                      style={{display:"flex",alignItems:"center",gap:11,padding:"10px 16px",
                              background:checked[item.id]?"rgba(34,197,94,.05)":"transparent",
                              borderLeft:checked[item.id]?`3px solid ${C.grn}`:"3px solid transparent"}}>
                      <div style={{width:21,height:21,borderRadius:6,flexShrink:0,
                                   border:`2px solid ${checked[item.id]?C.grn:"#3a3a3a"}`,
                                   background:checked[item.id]?C.grn:"transparent",
                                   display:"flex",alignItems:"center",justifyContent:"center",
                                   transition:"all .15s"}}>
                        {checked[item.id]&&<ICheck s={12} c="#fff"/>}
                      </div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:14,fontWeight:500,
                                     color:checked[item.id]?"#444":C.txt,
                                     textDecoration:checked[item.id]?"line-through":"none",
                                     whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                          {item.name}
                        </div>
                        <div style={{fontSize:10,color:"#3d3d3d",marginTop:1,
                                     fontFamily:"'Fira Code',monospace",display:"flex",gap:8}}>
                          {item.sku&&<span>#{item.sku}</span>}
                          <span>→ {item.qty}</span>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              ))
            }
            <div style={{height:72}}/>
          </>
        )}

        {/* ═══ Pöntunarsýn ═══ */}
        {view==="order" && (
          <>
            {count===0
              ? (
                <div style={{textAlign:"center",padding:"80px 20px",color:C.mut}}>
                  <ICart s={48} c={C.mut} style={{opacity:.12}}/>
                  <div style={{fontSize:16,marginTop:14}}>Pöntunin er tóm</div>
                  <div style={{fontSize:13,marginTop:7}}>Farðu á lagerlista og hakaðu við vörur</div>
                </div>
              )
              : (
                <>
                  {Object.entries(checkedGrp).map(([sup,items])=>(
                    <div key={sup} style={{margin:"12px 16px 0",background:C.s1,
                      borderRadius:12,border:`1px solid ${C.bd}`,overflow:"hidden"}}>
                      <div style={{padding:"10px 14px 8px",borderBottom:`1px solid ${C.bd}`,
                                   display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                        <div>
                          <div style={{fontWeight:600,fontSize:14}}>{sup}</div>
                          {SUPPLIER_EMAILS[sup]&&(
                            <div style={{fontSize:10,color:C.mut,fontFamily:"'Fira Code',monospace",marginTop:1}}>
                              {SUPPLIER_EMAILS[sup]}
                            </div>
                          )}
                        </div>
                        <button onClick={()=>sendEmail(sup)} className="tap" style={{
                          background:"rgba(232,93,4,.1)",border:"1px solid rgba(232,93,4,.25)",
                          color:C.acc,padding:"5px 11px",borderRadius:8,
                          fontSize:11,fontWeight:600,cursor:"pointer",
                          display:"flex",alignItems:"center",gap:4,fontFamily:"inherit"}}>
                          <IMail s={11} c={C.acc}/> Senda
                        </button>
                      </div>
                      {items.map((item,i)=>(
                        <div key={item.id} style={{display:"flex",alignItems:"center",
                          justifyContent:"space-between",padding:"8px 14px",
                          borderBottom:i<items.length-1?`1px solid ${C.bd}`:"none"}}>
                          <div style={{flex:1,minWidth:0}}>
                            <div style={{fontSize:13,fontWeight:500,
                                         whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                              {item.name}
                            </div>
                            <div style={{fontSize:10,color:C.mut,fontFamily:"'Fira Code',monospace",marginTop:1}}>
                              {item.sku?`#${item.sku} · `:""}{item.qty}
                            </div>
                          </div>
                          <button onClick={()=>toggle(item.id)} className="tap"
                            style={{background:"none",border:"none",cursor:"pointer",
                                    padding:4,display:"flex",marginLeft:8}}>
                            <IX s={13} c="#555"/>
                          </button>
                        </div>
                      ))}
                    </div>
                  ))}
                  <div style={{padding:"16px",display:"flex",flexDirection:"column",gap:8}}>
                    <button onClick={()=>sendEmail()} className="tap" style={{
                      width:"100%",padding:"14px",borderRadius:12,border:"none",
                      background:C.acc,color:"#fff",fontSize:14,fontWeight:600,cursor:"pointer",
                      display:"flex",alignItems:"center",justifyContent:"center",gap:8,fontFamily:"inherit"}}>
                      <IMail s={16} c="#fff"/> Senda yfirlit til mín · {count} vörur
                    </button>
                    <button onClick={()=>{setChecked({});showToast("Pöntun hreinsuð");}} className="tap" style={{
                      width:"100%",padding:"12px",borderRadius:12,background:"transparent",
                      border:`1px solid #2a2a2a`,color:C.mut,fontSize:13,cursor:"pointer",
                      display:"flex",alignItems:"center",justifyContent:"center",gap:7,fontFamily:"inherit"}}>
                      <ITrash s={13} c={C.mut}/> Hreinsa allt
                    </button>
                  </div>
                  <div style={{height:72}}/>
                </>
              )
            }
          </>
        )}
      </div>

      {/* Neðri flipastika */}
      <div style={{display:"flex",borderTop:`1px solid ${C.bd}`,flexShrink:0}}>
        {[
          {id:"list",  label:"Lager",   I:IBox},
          {id:"order", label:`Pöntun${count>0?` (${count})`:""}`, I:ICart},
        ].map(({id,label,I})=>(
          <button key={id} onClick={()=>setView(id)} className="tap" style={{
            flex:1,padding:"11px 8px",border:"none",background:"transparent",
            color:view===id?C.acc:C.mut,
            borderTop:view===id?`2px solid ${C.acc}`:"2px solid transparent",
            display:"flex",flexDirection:"column",alignItems:"center",gap:3,
            cursor:"pointer",marginTop:-1,fontFamily:"inherit"}}>
            <I s={18} c={view===id?C.acc:C.mut}/>
            <span style={{fontSize:11,fontWeight:view===id?600:400}}>{label}</span>
          </button>
        ))}
      </div>

      {/* Toast tilkynning */}
      {toast&&(
        <div className="anim" style={{
          position:"absolute",bottom:68,left:"50%",transform:"translateX(-50%)",
          background:"#1e1e1e",border:`1px solid ${C.bd}`,borderRadius:20,
          padding:"7px 16px",fontSize:12,color:C.txt,whiteSpace:"nowrap",
          boxShadow:"0 4px 20px rgba(0,0,0,.5)",zIndex:100}}>
          {toast}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
