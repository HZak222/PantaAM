// ══════════════════════════════════════════════
//  FIREBASE — deilður stöðugrunnur milli tækja
//  Ókeypis, ótakmarkaðar beiðnir, einn URL
// ══════════════════════════════════════════════
const fbRead = async (fbUrl) => {
  const res = await fetch(`${fbUrl}/state.json`);
  if(!res.ok) throw new Error(`Firebase villa: ${res.status}`);
  const d = await res.json();
  return d || {};
};

const fbWrite = async (fbUrl, data) => {
  const res = await fetch(`${fbUrl}/state.json`, {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data)
  });
  if(!res.ok) throw new Error(`Firebase write villa: ${res.status}`);
};

// PATCH updates only the given keys, leaving the rest of /state untouched —
// safe for updating "checked" without ever wiping "notification".
const fbPatch = async (fbUrl, partial) => {
  const res = await fetch(`${fbUrl}/state.json`, {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(partial)
  });
  if(!res.ok) throw new Error(`Firebase patch villa: ${res.status}`);
};

// ══════════════════════════════════════════════

// ══════════════════════════════════════════════
const norm = s=>(s||'').toLowerCase().replace(/[áä]/g,'a').replace(/[éê]/g,'e').replace(/[íî]/g,'i').replace(/[óö]/g,'o').replace(/[úü]/g,'u').replace(/ý/g,'y').replace(/ð/g,'d').replace(/þ/g,'th').replace(/æ/g,'ae');
const hits = (item,q)=>!q||norm(q).split(/\s+/).filter(Boolean).every(w=>norm(`${item.name} ${item.sku} ${item.sup}`).includes(w));
const grp  = (arr,key)=>arr.reduce((g,x)=>{(g[x[key]]=g[x[key]]||[]).push(x);return g;},{});
const buildOrder = (items,supName)=>{
  const dt=new Date().toLocaleDateString('is-IS');
  let b=supName?'Sælir,\n\nGeti þið sent okkur eftirfarandi:\n\n':`Pöntunaryfirlit – ${dt}\n\n`;
  Object.entries(grp(items,'sup')).forEach(([s,its])=>{
    if(!supName) b+=`── ${s} ──\n`;
    its.forEach(i=>{b+=`• ${i.name}`;if(i.sku)b+=` (VNR: ${i.sku})`;b+=` — ${i.qty}\n`;});
    b+='\n';
  });
  return b+(supName?'\nKveðja,\nVerkstæðið':'\nJLR Verkstæði Hesthálsi 6-8');
};
const ghCommit = async (apiUrl,token,newData,message)=>{
  const r=await fetch(apiUrl,{headers:{Authorization:`token ${token}`,Accept:'application/vnd.github.v3+json'}});
  const d=await r.json();
  const content=btoa(unescape(encodeURIComponent(JSON.stringify(newData,null,2))));
  const body={message,content};
  if(r.ok&&d.sha) body.sha=d.sha;
  const put=await fetch(apiUrl,{method:'PUT',headers:{Authorization:`token ${token}`,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!put.ok){const e=await put.json();throw new Error(e.message||'commit villa');}
};

function App(){
  // Identity
  const [userName,   setUserName]   = useState('');
  const [nameSet,    setNameSet]    = useState(false);
  const [isAdmin,    setIsAdmin]    = useState(false);

  // Config (from GitHub config.json, available to ALL)
  const [web3Key,    setWeb3Key]    = useState('');
  const [adminName,  setAdminName]  = useState('AMJ');
  const [fbUrl,      setFbUrl]      = useState('');
  const [configReady,setConfigReady]= useState(false);

  // Data
  const [items,      setItems]      = useState([]);
  const [loading,    setLoading]    = useState(true);

  // Shared state (from Firebase)
  // checked = {id: true/false, ...}
  // notification = {by: 'Jón', at: '...', count: 3} | null
  const [checked,    setChecked]    = useState({});
  const [notification,setNotification]= useState(null); // last "láta vita"
  const [syncStatus, setSyncStatus] = useState('idle'); // 'idle'|'syncing'|'synced'|'error'
  const syncTimer = useRef(null);
  const lastWritten = useRef(null); // avoid re-writing same state

  // UI
  const [view,       setView]       = useState('list');
  const [cat,        setCat]        = useState('Efnavörur');
  const [query,      setQuery]      = useState('');
  const [supF,       setSupF]       = useState('');
  const [allCats,    setAllCats]    = useState(false);
  const [modal,      setModal]      = useState(null);
  const [toast,      setToast]      = useState(null);
  const [listening,  setListening]  = useState(false);

  // Notification flow
  const [notifSending,setNotifSending]= useState(false);
  const [notifDone,  setNotifDone]  = useState(false);
  const [hvatning,   setHvatning]   = useState('');
  const confettiRef = useRef(null);

  // Admin
  const [ghToken,    setGhToken]    = useState('');
  const [pwInput,    setPwInput]    = useState('');
  const [pwError,    setPwError]    = useState(false);
  const [newPw,      setNewPw]      = useState('');
  const [saving,     setSaving]     = useState(false);
  // Settings fields for new keys
  const [settW3,     setSettW3]     = useState('');
  const [settFbUrl,  setSettFbUrl]  = useState('');

  // Item CRUD
  const [newItem,    setNewItem]    = useState({name:'',sku:'',sup:'Kemi',cat:'Efnavörur',qty:''});
  const [editItem,   setEditItem]   = useState(null);
  const [delId,      setDelId]      = useState(null);

  // Photo
  const photoRef = useRef(null);
  const [photoFile,    setPhotoFile]    = useState(null);
  const [photoPreview, setPhotoPreview] = useState(null);
  const [photoDesc,    setPhotoDesc]    = useState('');
  const [photoSending, setPhotoSending] = useState(false);
  const [photoErr,     setPhotoErr]     = useState(null);

  // Order share
  const [orderShare, setOrderShare] = useState(null);

  // ── INIT ─────────────────────────────────────
  useEffect(()=>{
    const n=localStorage.getItem('vrkst-name'); if(n){setUserName(n);setNameSet(true);}
    const tk=localStorage.getItem('vrkst-token'); if(tk) setGhToken(tk);
    // Fetch config + items in parallel
    fetchConfig();
    fetchItems();
  },[]);

  // ── FETCH CONFIG ─────────────────────────────
  const fetchConfig = async () => {
    try{
      const res=await fetch(`${CONFIG_URL}?t=${Date.now()}`);
      if(!res.ok) return;
      const d=await res.json();
      if(d.w3key&&!d.w3key.startsWith('SETJA_'))  setWeb3Key(d.w3key);
      if(d.admin_name)                             setAdminName(d.admin_name);
      if(d.firebase_url&&!d.firebase_url.startsWith('SETJA_')) setFbUrl(d.firebase_url);
    }catch{}
    finally{setConfigReady(true);}
  };

  // ── FETCH SHARED STATE (Firebase) ──────────────
  // Called once config is ready and fbUrl is set
  useEffect(()=>{
    if(configReady&&fbUrl) fetchSharedState();
  },[configReady,fbUrl]);

  const fetchSharedState = async () => {
    if(!fbUrl) return;
    setSyncStatus('syncing');
    try{
      const state = await fbRead(fbUrl);
      if(state.checked) setChecked(state.checked);
      if(state.notification!==undefined) setNotification(state.notification);
      lastWritten.current = JSON.stringify(state.checked||{});
      setSyncStatus('synced');
    }catch(e){
      setSyncStatus('error');
    }
  };

  // ── LIVE SYNC (Firebase SSE) ────────────────────
  // Streams changes from ANY device the instant they happen —
  // this is what makes checkboxes sync between phones in real time.
  useEffect(()=>{
    if(!fbUrl) return;
    let es;
    try{
      es = new EventSource(`${fbUrl}/state.json`);
      const applyData = (data)=>{
        if(!data||typeof data!=='object') return;
        if(data.checked!==undefined){
          const nc = data.checked||{};
          setChecked(nc);
          lastWritten.current = JSON.stringify(nc);
        }
        if(data.notification!==undefined) setNotification(data.notification);
      };
      es.addEventListener('put', e=>{
        try{
          const msg = JSON.parse(e.data);
          // Root update — msg.data is the full state object
          if(msg.path==='/') applyData(msg.data);
          else if(msg.path==='/checked'){ setChecked(msg.data||{}); lastWritten.current=JSON.stringify(msg.data||{}); }
          else if(msg.path==='/notification') setNotification(msg.data);
          setSyncStatus('synced');
        }catch{}
      });
      es.addEventListener('patch', e=>{
        try{
          const msg = JSON.parse(e.data);
          if(msg.data&&msg.data.checked!==undefined){ setChecked(msg.data.checked||{}); lastWritten.current=JSON.stringify(msg.data.checked||{}); }
          if(msg.data&&msg.data.notification!==undefined) setNotification(msg.data.notification);
          setSyncStatus('synced');
        }catch{}
      });
      es.onerror = ()=>{ setSyncStatus('error'); };
    }catch{}
    return ()=>{ if(es) es.close(); };
  },[fbUrl]);

  // ── WRITE SHARED STATE — debounced 1s ─────────
  const writeSharedState = useCallback((newChecked) => {
    if(!fbUrl) return;
    const serialized = JSON.stringify(newChecked);
    if(serialized === lastWritten.current) return;
    if(syncTimer.current) clearTimeout(syncTimer.current);
    setSyncStatus('syncing');
    syncTimer.current = setTimeout(async ()=>{
      try{
        await fbPatch(fbUrl, {checked: newChecked});
        lastWritten.current = serialized;
        setSyncStatus('synced');
      }catch{
        setSyncStatus('error');
      }
    }, 500);
  },[fbUrl]);

  // ── TOGGLE ITEM (shared) ───────────────────────
  const toggle = useCallback(id => {
    setChecked(prev => {
      const next = {...prev, [id]: !prev[id]};
      // Remove false values to keep state clean
      if(!next[id]) delete next[id];
      writeSharedState(next);
      return next;
    });
  },[writeSharedState]);

  // ── FETCH ITEMS ───────────────────────────────
  const fetchItems=async()=>{
    setLoading(true);
    try{
      const res=await fetch(`${ITEMS_URL}?t=${Date.now()}`);
      if(!res.ok) throw new Error();
      const d=await res.json();
      setItems(d);
      localStorage.setItem('vrkst-items',JSON.stringify(d));
    }catch{
      const ca=localStorage.getItem('vrkst-items'); if(ca) setItems(JSON.parse(ca));
    }
    finally{setLoading(false);}
  };

  // ── SAVE CONFIG ───────────────────────────────
  const saveConfig = async (newConf) => {
    if(!ghToken){showToast('GitHub token vantar');return;}
    setSaving(true);
    try{
      const full={w3key:newConf.w3||web3Key, admin_name:adminName, admin_email:ADMIN_EMAIL, firebase_url:newConf.fbUrl||fbUrl};
      await ghCommit(CONFIG_API, ghToken, full, 'Uppfært config');
      if(newConf.w3)    setWeb3Key(newConf.w3);
      if(newConf.fbUrl) setFbUrl(newConf.fbUrl);
      setSettW3(''); setSettFbUrl('');
      showToast('✓ Config vistað á GitHub — allir notendur uppfærðir!');
    }catch(e){showToast(`Villa: ${e.message}`);}
    finally{setSaving(false);}
  };

  // ── ITEM CRUD ─────────────────────────────────
  const commitItems=async(newItems,msg)=>{
    if(!ghToken) throw new Error('GitHub token vantar');
    await ghCommit(ITEMS_API,ghToken,newItems,msg);
    setItems(newItems);
    localStorage.setItem('vrkst-items',JSON.stringify(newItems));
  };
  const addItem=async()=>{
    if(!newItem.name.trim()||!newItem.qty.trim()) return showToast('Fylltu út nafn og magn');
    setSaving(true);
    try{await commitItems([...items,{id:`u${Date.now()}`,...newItem}],`Bætt við: ${newItem.name}`);setNewItem({name:'',sku:'',sup:'Kemi',cat:'Efnavörur',qty:''});setModal(null);showToast('✓ Vöru bætt við!');}
    catch(e){showToast(`Villa: ${e.message}`);}
    finally{setSaving(false);}
  };
  const saveEdit=async()=>{
    if(!editItem?.name?.trim()||!editItem?.qty?.trim()) return showToast('Fylltu út nafn og magn');
    setSaving(true);
    try{await commitItems(items.map(i=>i.id===editItem.id?editItem:i),`Breytti: ${editItem.name}`);setEditItem(null);showToast('✓ Vara uppfærð!');}
    catch(e){showToast(`Villa: ${e.message}`);}
    finally{setSaving(false);}
  };
  const deleteItem=async(id)=>{
    setSaving(true);
    try{
      await commitItems(items.filter(i=>i.id!==id),'Eytti vöru');
      const next={...checked}; delete next[id]; setChecked(next);
      writeSharedState(next);
      setDelId(null); showToast('✓ Vöru eytt!');
    }catch(e){showToast(`Villa: ${e.message}`);}
    finally{setSaving(false);}
  };

  // ── SEND NOTIFICATION ─────────────────────────
  const sendNotification=async()=>{
    if(!web3Key){showToast('Admin þarf að setja upp Web3Forms lykil (⚙️)');return;}
    if(!count) return;
    setNotifSending(true);
    try{
      const dt=new Date();
      const dtStr=dt.toLocaleString('is-IS');
      const rows=checkedList.map(i=>`<tr><td style="padding:6px 12px;border-bottom:1px solid #eee;font-weight:500">${i.name}</td><td style="padding:6px 12px;border-bottom:1px solid #eee;color:#888;font-size:12px">${i.sku||'—'}</td><td style="padding:6px 12px;border-bottom:1px solid #eee">${i.qty}</td></tr>`).join('');
      const html=`<div style="font-family:sans-serif;max-width:560px;color:#111"><h2 style="color:#E85D04;margin-bottom:4px">📋 Pöntunarbeiðni</h2><p style="color:#666;margin-bottom:16px"><b>Frá:</b> ${userName} &nbsp;·&nbsp; <b>Dagsetning:</b> ${dtStr}</p><table style="width:100%;border-collapse:collapse;margin-bottom:24px"><thead><tr style="background:#f9f9f9"><th style="padding:8px 12px;text-align:left;font-size:12px">Vara</th><th style="padding:8px 12px;text-align:left;font-size:12px">VNR</th><th style="padding:8px 12px;text-align:left;font-size:12px">Magn</th></tr></thead><tbody>${rows}</tbody></table><p style="color:#888;font-size:13px">Hakarnir halda sér í appinu svo þú getir sent pöntunina þegar hentar.</p></div>`;
      const res=await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({access_key:web3Key,subject:`📋 Pöntunarbeiðni frá ${userName} — ${count} vörur`,from_name:userName,message:html,html:true,botcheck:false})});
      const d=await res.json();
      if(!d.success) throw new Error(d.message||'villa');

      // Update shared state with notification info (checked list stays untouched)
      const notif={by:userName, at:dt.toISOString(), count};
      setNotification(notif);
      if(fbUrl){
        try{ await fbPatch(fbUrl,{notification:notif}); setSyncStatus('synced'); }catch{}
      }
      setNotifDone(true);
      setHvatning(HVATNINGAR[Math.floor(Math.random()*HVATNINGAR.length)]);
    }catch(e){showToast(`Sending mistókst: ${e.message||'net villa'}`);}
    finally{setNotifSending(false);}
  };

  // ── CLEAR ORDER (admin) ───────────────────────
  const clearOrder=async()=>{
    const emptyChecked={};
    setChecked(emptyChecked);
    setNotification(null);
    if(fbUrl){
      try{await fbWrite(fbUrl,{checked:{},notification:null});setSyncStatus('synced');}catch{}
    }
    showToast('✓ Pöntun hreinsuð');
  };

  // ── PHOTO ─────────────────────────────────────
  const onPhotoChange=e=>{const f=e.target.files[0];if(!f)return;setPhotoFile(f);setPhotoPreview(URL.createObjectURL(f));setPhotoErr(null);setModal('photo');};
  const compressImg=(file,max=350,q=0.55)=>new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{let{width:w,height:h}=img;if(w>max||h>max){const r=Math.min(max/w,max/h);w=Math.round(w*r);h=Math.round(h*r);}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);const b64=c.toDataURL('image/jpeg',q);if(b64.length<100)rej(new Error('compress'));else res(b64);};
    img.onerror=rej;img.src=URL.createObjectURL(file);
  });
  const sendPhoto=async()=>{
    if(!web3Key){setPhotoErr('Admin þarf að setja upp Web3Forms lykil (⚙️)');return;}
    if(photoSending)return;
    setPhotoSending(true);setPhotoErr(null);
    try{
      let imgTag='';
      if(photoFile){try{const b64=await compressImg(photoFile);imgTag=`<br><img src="${b64}" style="max-width:320px;border-radius:8px;margin-top:8px"/>`;}catch{imgTag='<br><i>(Mynd tókst ekki)</i>';}}
      const html=`<div style="font-family:sans-serif;max-width:500px"><h2 style="color:#E85D04">📦 Tillaga að nýrri vöru</h2><p><b>Sendandi:</b> ${userName}</p><p><b>Dagsetning:</b> ${new Date().toLocaleString('is-IS')}</p><p><b>Lýsing:</b> ${photoDesc||'(engin lýsing)'}</p>${imgTag}</div>`;
      const res=await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({access_key:web3Key,subject:`📦 Tillaga frá ${userName}`,from_name:userName,message:html,html:true,botcheck:false})});
      const d=await res.json();
      if(!d.success) throw new Error(d.message||'villa');
      showToast('✓ Tillaga send!');resetPhoto();
    }catch(e){setPhotoErr(`Sending mistókst: ${e.message}`);}
    finally{setPhotoSending(false);}
  };
  const resetPhoto=()=>{setPhotoFile(null);setPhotoPreview(null);setPhotoDesc('');setPhotoErr(null);setModal(null);if(photoRef.current)photoRef.current.value='';};

  // ── ORDER SHARE ───────────────────────────────
  const openOrderShare=(supName=null)=>{
    const its=supName?checkedList.filter(i=>i.sup===supName):checkedList;
    if(!its.length)return;
    const dt=new Date().toLocaleDateString('is-IS');
    setOrderShare({to:supName?(SUP_EMAILS[supName]||ADMIN_EMAIL):ADMIN_EMAIL,subject:supName?`Pöntun ${dt} – ${its.length} vörur`:`Pöntunaryfirlit ${dt} – ${count} vörur`,body:buildOrder(its,supName)});
  };

  // ── CONFETTI / FLUGELDAR ─────────────────────
  useEffect(()=>{
    if(!notifDone) return;
    const canvas = confettiRef.current;
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio||1;
    const resize = ()=>{
      canvas.width = canvas.offsetWidth*dpr;
      canvas.height = canvas.offsetHeight*dpr;
      ctx.scale(dpr,dpr);
    };
    resize();
    const W = canvas.offsetWidth, H = canvas.offsetHeight;
    const colors = ['#E85D04','#22c55e','#f59e0b','#3b82f6','#ec4899','#fff'];
    const particles = [];
    // Confetti burst
    for(let i=0;i<90;i++){
      particles.push({
        x: W/2, y: H*0.35,
        vx: (Math.random()-0.5)*14,
        vy: (Math.random()-1.4)*13,
        size: 4+Math.random()*5,
        color: colors[Math.floor(Math.random()*colors.length)],
        rot: Math.random()*360,
        vrot: (Math.random()-0.5)*20,
        shape: Math.random()>0.5?'rect':'circle',
        gravity: 0.35+Math.random()*0.15,
        life: 1
      });
    }
    let raf;
    const tick = ()=>{
      ctx.clearRect(0,0,W,H);
      let alive=false;
      particles.forEach(p=>{
        if(p.life<=0) return;
        alive=true;
        p.vy += p.gravity;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vrot;
        p.life -= 0.008;
        ctx.save();
        ctx.globalAlpha = Math.max(p.life,0);
        ctx.translate(p.x,p.y);
        ctx.rotate(p.rot*Math.PI/180);
        ctx.fillStyle = p.color;
        if(p.shape==='rect') ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
        else { ctx.beginPath(); ctx.arc(0,0,p.size/2,0,Math.PI*2); ctx.fill(); }
        ctx.restore();
      });
      if(alive) raf = requestAnimationFrame(tick);
    };
    tick();
    return ()=>{ if(raf) cancelAnimationFrame(raf); };
  },[notifDone]);

  // ── MISC ──────────────────────────────────────
  const startVoice=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){showToast('Hljóðþekking er ekki studd');return;}const r=new SR();r.lang='is-IS';r.onstart=()=>setListening(true);r.onend=()=>setListening(false);r.onerror=()=>setListening(false);r.onresult=e=>{setQuery(e.results[0][0].transcript);setAllCats(false);};r.start();};
  const loginAdmin=()=>{const stored=localStorage.getItem('vrkst-pw')||DEFAULT_PW;if(pwInput===stored){setIsAdmin(true);setPwError(false);setPwInput('');}else setPwError(true);};
  const showToast=msg=>{setToast(msg);setTimeout(()=>setToast(null),2800);};

  // ── DERIVED ───────────────────────────────────
  const visible=useMemo(()=>{let it=allCats?items:items.filter(i=>i.cat===cat);if(supF)it=it.filter(i=>i.sup===supF);if(query)it=it.filter(i=>hits(i,query));return it;},[items,cat,query,supF,allCats]);
  const grouped    =useMemo(()=>grp(visible,'sup'),[visible]);
  const checkedList=useMemo(()=>items.filter(i=>checked[i.id]),[items,checked]);
  const checkedGrp =useMemo(()=>grp(checkedList,'sup'),[checkedList]);
  const count      =checkedList.length;
  const suppliers  =useMemo(()=>[...new Set(items.filter(i=>i.cat===cat).map(i=>i.sup))],[items,cat]);

  const Divider=({label})=>(
    <div style={{display:'flex',alignItems:'center',padding:'8px 16px 2px',gap:8}}>
      <div style={{height:1,flex:1,background:C.bd}}/><span style={{fontSize:10,color:C.mut,letterSpacing:2,textTransform:'uppercase',fontWeight:600}}>{label}</span><div style={{height:1,flex:1,background:C.bd}}/>
    </div>
  );

  // ── SYNC STATUS indicator ─────────────────────
  const SyncDot=()=>{
    if(!fbUrl) return null;
    const color = syncStatus==='synced'?C.grn : syncStatus==='error'?C.red : C.amb;
    const cls   = syncStatus==='syncing'?'blink':'';
    return <div title={syncStatus==='synced'?'Samstillt':syncStatus==='error'?'Samstillingarerror':'Samstilli...'} className={cls} style={{width:6,height:6,borderRadius:'50%',background:color,flexShrink:0}}/>;
  };

  // ── Notification banner ───────────────────────
  const hasNotif = notification && notification.by && count > 0;
  const notifTime = notification?.at ? new Date(notification.at).toLocaleString('is-IS',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'}) : '';

  // ══════════════════════════════════════
  //  NAME SETUP
  // ══════════════════════════════════════
  if(!nameSet) return(
    <div style={{background:C.bg,height:'100%',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:32}}>
      <div style={{fontFamily:'Oxanium,sans-serif',fontSize:32,fontWeight:700,color:C.acc,marginBottom:4}}>VERKSTÆÐIÐ</div>
      <div style={{fontSize:11,color:C.mut,letterSpacing:2,textTransform:'uppercase',marginBottom:48}}>Efnalager · Pöntunarkerfi</div>
      <div style={{width:'100%',maxWidth:320}}>
        <div style={{fontSize:18,fontWeight:600,marginBottom:6}}>Hvað heitirðu?</div>
        <div style={{fontSize:13,color:C.mut,marginBottom:20}}>Nafnið þitt birtist þegar þú sendir inn beiðni</div>
        <input value={userName} onChange={e=>setUserName(e.target.value)}
          onKeyDown={e=>{if(e.key==='Enter'&&userName.trim()){localStorage.setItem('vrkst-name',userName.trim());setNameSet(true);}}}
          placeholder="Nafn þitt..." autoFocus
          style={{width:'100%',background:C.s1,border:`1px solid ${C.bd}`,borderRadius:12,padding:'14px 16px',color:C.txt,fontSize:16,outline:'none',fontFamily:'inherit',marginBottom:12}}/>
        <button onClick={()=>{if(!userName.trim())return;localStorage.setItem('vrkst-name',userName.trim());setNameSet(true);}}
          className="tap" style={{width:'100%',padding:14,borderRadius:12,border:'none',background:userName.trim()?C.acc:'#222',color:'#fff',fontSize:15,fontWeight:600,cursor:'pointer'}}>
          Áfram →
        </button>
      </div>
    </div>
  );

  // ══════════════════════════════════════
  //  MAIN APP
  // ══════════════════════════════════════
  return(
    <div style={{background:C.bg,color:C.txt,height:'100%',maxWidth:480,margin:'0 auto',display:'flex',flexDirection:'column',overflow:'hidden',position:'relative'}}>

      {/* HEADER */}
      <div style={{padding:'12px 16px 10px',borderBottom:`1px solid ${C.bd}`,flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <div>
              <div style={{fontFamily:'Oxanium,sans-serif',fontSize:24,fontWeight:700,color:C.acc,letterSpacing:1,lineHeight:1}}>VERKSTÆÐIÐ</div>
              <div style={{fontSize:10,color:C.mut,letterSpacing:1.5,textTransform:'uppercase',marginTop:1,display:'flex',alignItems:'center',gap:5}}>
                {userName} {isAdmin&&<span style={{color:C.acc,fontWeight:700}}>· Admin</span>}
                <SyncDot/>
              </div>
            </div>
          </div>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            {isAdmin&&count>0&&<div style={{background:C.acc,color:'#fff',borderRadius:20,padding:'3px 10px',fontSize:13,fontWeight:600,display:'flex',alignItems:'center',gap:4}}><ICart s={13} c="#fff"/> {count}</div>}
            <button onClick={()=>setModal('settings')} className="tap" style={{background:'none',border:'none',color:isAdmin?C.acc:C.mut,cursor:'pointer',padding:4,display:'flex'}}>
              <IGear s={20} c={isAdmin?C.acc:C.mut}/>
            </button>
          </div>
        </div>
        {/* SEARCH */}
        <div style={{display:'flex',gap:6}}>
          <div style={{flex:1,display:'flex',alignItems:'center',background:C.s1,border:`1px solid ${C.bd}`,borderRadius:10,padding:'8px 10px',gap:7}}>
            <ISearch s={14} c={C.mut}/>
            <input value={query} onChange={e=>{setQuery(e.target.value);setAllCats(false);}} onKeyDown={e=>e.key==='Enter'&&(setAllCats(true),setSupF(''))} placeholder="Leita..." style={{flex:1,background:'none',border:'none',outline:'none',color:C.txt,fontSize:14,fontFamily:'inherit'}}/>
            {query&&<button onClick={()=>{setQuery('');setSupF('');setAllCats(false);}} className="tap" style={{background:'none',border:'none',color:C.mut,cursor:'pointer',padding:0,display:'flex'}}><IX s={13} c={C.mut}/></button>}
          </div>
          <button onClick={startVoice} className={`tap${listening?' puls':''}`} style={{width:38,height:38,borderRadius:10,border:'none',cursor:'pointer',background:listening?C.acc:C.s1,display:'flex',alignItems:'center',justifyContent:'center'}}>
            <IMic s={15} c={listening?'#fff':C.mut}/>
          </button>
          <button onClick={()=>{if(!loading){fetchItems();fetchSharedState();}}} className="tap" style={{width:38,height:38,borderRadius:10,border:`1px solid ${C.bd}`,background:C.s1,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>
            <IRefresh s={14} c={C.mut} cls={loading?'spin':''}/>
          </button>
        </div>
      </div>

      {/* NOTIFICATION BANNER — "Jón bað um pöntun · 14:30" */}
      {hasNotif&&(
        <div style={{background:'rgba(245,158,11,.08)',borderBottom:`1px solid rgba(245,158,11,.2)`,padding:'7px 16px',display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
          <IBell s={13} c={C.amb} cls="blink"/>
          <span style={{fontSize:12,color:C.amb,fontWeight:600,flex:1}}>
            {notification.by} bað um pöntun · {notifTime} · {notification.count} vörur
          </span>
          {isAdmin&&<button onClick={clearOrder} style={{background:'none',border:'none',color:C.mut,cursor:'pointer',fontSize:11,padding:'2px 6px',fontFamily:'inherit'}}>hreinsa eftir pöntun</button>}
        </div>
      )}

      {/* FILTERS */}
      {view==='list'&&(
        <div style={{padding:'8px 16px',borderBottom:`1px solid ${C.bd}`,flexShrink:0}}>
          <div style={{display:'flex',gap:6,marginBottom:7}}>
            {['Efnavörur','Perur'].map(c=>(
              <button key={c} className="tap" onClick={()=>{setCat(c);setSupF('');setAllCats(false);}}
                style={{padding:'5px 13px',borderRadius:20,border:'none',background:cat===c&&!allCats?C.acc:C.s2,color:cat===c&&!allCats?'#fff':C.mut,fontSize:12,fontWeight:500,cursor:'pointer',display:'flex',alignItems:'center',gap:5}}>
                {c==='Efnavörur'?<IBox s={11} c={cat===c&&!allCats?'#fff':C.mut}/>:<IBulb s={11} c={cat===c&&!allCats?'#fff':C.mut}/>}{c}
              </button>
            ))}
          </div>
          {!allCats&&<div className="hscroll">
            {['',...(Array.isArray(suppliers)?suppliers:[])].map(s=>(
              <button key={s||'all'} className="tap" onClick={()=>setSupF(supF===s?'':s)}
                style={{padding:'3px 9px',borderRadius:12,fontSize:11,whiteSpace:'nowrap',fontFamily:'inherit',cursor:'pointer',border:`1px solid ${supF===s?C.acc:C.bd}`,background:supF===s?'rgba(232,93,4,.12)':'transparent',color:supF===s?C.acc:C.mut}}>
                {s||'Allar'}
              </button>
            ))}
          </div>}
        </div>
      )}

      {/* SCROLL AREA */}
      <div style={{flex:1,overflowY:'auto'}}>

        {/* LIST VIEW */}
        {view==='list'&&(
          <>
            {loading&&items.length===0&&<div style={{textAlign:'center',padding:'60px 20px',color:C.mut}}><IRefresh s={32} c={C.mut} cls="spin" st={{opacity:.3}}/><div style={{fontSize:14,marginTop:12}}>Sæki vörulista...</div></div>}
            {!fbUrl&&configReady&&!isAdmin&&(
              <div style={{margin:'16px',padding:'12px 14px',background:'rgba(245,158,11,.06)',border:`1px solid rgba(245,158,11,.15)`,borderRadius:10,display:'flex',gap:10,alignItems:'flex-start'}}>
                <IWifi s={16} c={C.amb} st={{flexShrink:0,marginTop:2}}/>
                <div style={{fontSize:12,color:'#999',lineHeight:1.5}}>Deiling milli tækja er ekki sett upp. Admin þarf að stilla Firebase í stillingum (⚙️).</div>
              </div>
            )}
            {Object.entries(grouped).map(([sup,its])=>(
              <div key={sup}>
                <Divider label={sup}/>
                {its.map(item=>(
                  <div key={item.id} style={{display:'flex',alignItems:'center',padding:'10px 16px',gap:11,
                    background:checked[item.id]?'rgba(34,197,94,.06)':'transparent',
                    borderLeft:checked[item.id]?`3px solid ${C.grn}`:'3px solid transparent',
                    transition:'background .12s,border-color .12s'}}>
                    {/* Checkbox */}
                    <div onClick={()=>toggle(item.id)} className="tap" style={{width:22,height:22,borderRadius:6,flexShrink:0,cursor:'pointer',border:`2px solid ${checked[item.id]?C.grn:'#3a3a3a'}`,background:checked[item.id]?C.grn:'transparent',display:'flex',alignItems:'center',justifyContent:'center',transition:'all .15s'}}>
                      {checked[item.id]&&<ICheck s={13} c="#fff"/>}
                    </div>
                    {/* Name */}
                    <div onClick={()=>toggle(item.id)} className="tap" style={{flex:1,minWidth:0,cursor:'pointer'}}>
                      <div style={{fontSize:14,fontWeight:500,color:checked[item.id]?'#3a3a3a':C.txt,textDecoration:checked[item.id]?'line-through':'none',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{item.name}</div>
                      <div style={{fontSize:10,color:'#3d3d3d',marginTop:1,fontFamily:"'Fira Code',monospace",display:'flex',gap:8}}>
                        {item.sku&&<span>#{item.sku}</span>}<span>→ {item.qty}</span>
                      </div>
                    </div>
                    {/* Admin edit/delete */}
                    {isAdmin&&(
                      <div style={{display:'flex',gap:2,flexShrink:0}}>
                        <button onClick={()=>setEditItem({...item})} className="tap" style={{background:'none',border:'none',cursor:'pointer',padding:6,display:'flex'}}><IEdit s={14} c="#555"/></button>
                        <button onClick={()=>setDelId(item.id)} className="tap" style={{background:'none',border:'none',cursor:'pointer',padding:6,display:'flex'}}><ITrash s={14} c="#555"/></button>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            ))}
            <div style={{height:count>0?140:80}}/>
          </>
        )}

        {/* ORDER VIEW (admin only) */}
        {view==='order'&&isAdmin&&(
          <>
            {count===0
              ?<div style={{textAlign:'center',padding:'80px 20px',color:C.mut}}><ICart s={48} c={C.mut} st={{opacity:.12}}/><div style={{fontSize:16,marginTop:14}}>Pöntunin er tóm</div></div>
              :(
                <>
                  {Object.entries(checkedGrp).map(([sup,its])=>(
                    <div key={sup} style={{margin:'12px 16px 0',background:C.s1,borderRadius:12,border:`1px solid ${C.bd}`,overflow:'hidden'}}>
                      <div style={{padding:'10px 14px 8px',borderBottom:`1px solid ${C.bd}`,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                        <div><div style={{fontWeight:600,fontSize:14}}>{sup}</div>{SUP_EMAILS[sup]&&<div style={{fontSize:10,color:C.mut,fontFamily:"'Fira Code',monospace",marginTop:1}}>{SUP_EMAILS[sup]}</div>}</div>
                        <button onClick={()=>openOrderShare(sup)} className="tap" style={{background:'rgba(232,93,4,.1)',border:'1px solid rgba(232,93,4,.25)',color:C.acc,padding:'5px 11px',borderRadius:8,fontSize:11,fontWeight:600,cursor:'pointer',display:'flex',alignItems:'center',gap:4,fontFamily:'inherit'}}><IMail s={11} c={C.acc}/> Senda</button>
                      </div>
                      {its.map((item,i)=>(
                        <div key={item.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 14px',borderBottom:i<its.length-1?`1px solid ${C.bd}`:'none'}}>
                          <div style={{flex:1,minWidth:0}}><div style={{fontSize:13,fontWeight:500,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{item.name}</div><div style={{fontSize:10,color:C.mut,fontFamily:"'Fira Code',monospace",marginTop:1}}>{item.sku?`#${item.sku} · `:''}{item.qty}</div></div>
                          <button onClick={()=>toggle(item.id)} className="tap" style={{background:'none',border:'none',cursor:'pointer',padding:4,display:'flex',marginLeft:8}}><IX s={13} c="#555"/></button>
                        </div>
                      ))}
                    </div>
                  ))}
                  <div style={{padding:'16px',display:'flex',flexDirection:'column',gap:8}}>
                    <button onClick={()=>openOrderShare()} className="tap" style={{width:'100%',padding:14,borderRadius:12,border:'none',background:C.acc,color:'#fff',fontSize:14,fontWeight:600,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:8,fontFamily:'inherit'}}>
                      <IMail s={16} c="#fff"/> Senda yfirlit til mín · {count} vörur
                    </button>
                    <button onClick={clearOrder} className="tap" style={{width:'100%',padding:12,borderRadius:12,background:'transparent',border:`1px solid #2a2a2a`,color:C.mut,fontSize:13,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:7,fontFamily:'inherit'}}>
                      <ITrash s={13} c={C.mut}/> Hreinsa pöntun (eftir sendingu)
                    </button>
                  </div>
                  <div style={{height:80}}/>
                </>
              )
            }
          </>
        )}
      </div>

      {/* BOTTOM NAV */}
      <div style={{display:'flex',borderTop:`1px solid ${C.bd}`,flexShrink:0}}>
        <button onClick={()=>setView('list')} className="tap" style={{flex:1,padding:'11px 8px',border:'none',background:'transparent',color:view==='list'?C.acc:C.mut,borderTop:view==='list'?`2px solid ${C.acc}`:'2px solid transparent',display:'flex',flexDirection:'column',alignItems:'center',gap:3,cursor:'pointer',marginTop:-1,fontFamily:'inherit'}}>
          <IBox s={18} c={view==='list'?C.acc:C.mut}/><span style={{fontSize:11,fontWeight:view==='list'?600:400}}>Lager</span>
        </button>
        {isAdmin&&(
          <button onClick={()=>setView('order')} className="tap" style={{flex:1,padding:'11px 8px',border:'none',background:'transparent',color:view==='order'?C.acc:C.mut,borderTop:view==='order'?`2px solid ${C.acc}`:'2px solid transparent',display:'flex',flexDirection:'column',alignItems:'center',gap:3,cursor:'pointer',marginTop:-1,fontFamily:'inherit'}}>
            <ICart s={18} c={view==='order'?C.acc:C.mut}/><span style={{fontSize:11,fontWeight:view==='order'?600:400}}>Pöntun{count>0?` (${count})`:''}</span>
          </button>
        )}
      </div>

      {/* FABs */}
      <input ref={photoRef} type="file" accept="image/*" capture="environment" style={{display:'none'}} onChange={onPhotoChange}/>
      <button onClick={()=>photoRef.current&&photoRef.current.click()} className="tap"
        style={{position:'absolute',right:16,bottom:count>0&&!isAdmin?134:74,background:C.s1,border:`1px solid ${C.bd}`,borderRadius:14,padding:'9px 13px',display:'flex',alignItems:'center',gap:7,cursor:'pointer',boxShadow:'0 4px 16px rgba(0,0,0,.5)',zIndex:10}}>
        <ICamera s={16} c={C.acc}/><span style={{fontSize:12,fontWeight:600,color:C.txt,whiteSpace:'nowrap'}}>Senda inn tillögu af vöru</span>
      </button>
      {isAdmin&&<button onClick={()=>setModal('addItem')} className="tap" style={{position:'absolute',left:16,bottom:74,background:C.s1,border:`1px solid ${C.bd}`,borderRadius:14,padding:'9px 13px',display:'flex',alignItems:'center',gap:7,cursor:'pointer',boxShadow:'0 4px 16px rgba(0,0,0,.5)',zIndex:10}}><IPlus s={16} c={C.acc}/><span style={{fontSize:12,fontWeight:600,color:C.txt}}>Bæta við vöru</span></button>}
      {!isAdmin&&count>0&&(
        <div className="anim" style={{position:'absolute',bottom:74,left:16,right:16,zIndex:20}}>
          <button onClick={sendNotification} disabled={notifSending} className="tap"
            style={{width:'100%',padding:'14px',borderRadius:14,border:'none',background:notifSending?'#2a2a2a':C.acc,color:'#fff',fontSize:15,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:9,boxShadow:'0 4px 22px rgba(232,93,4,.4)',fontFamily:'inherit'}}>
            {notifSending?<><IRefresh s={17} c="#fff" cls="spin"/>Sendi...</>:<><IBell s={17} c="#fff"/>Láta vita · {count} vörur</>}
          </button>
        </div>
      )}

      {/* ══════════════ MODALS ══════════════ */}

      {/* SETTINGS */}
      {modal==='settings'&&(
        <Sheet onClose={()=>setModal(null)}>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16}}>
            <div style={{width:38,height:38,borderRadius:'50%',background:isAdmin?C.acc:C.s2,border:`2px solid ${isAdmin?C.acc:C.bd}`,display:'flex',alignItems:'center',justifyContent:'center'}}>{isAdmin?<IShield s={18} c="#fff"/>:<IUser s={18} c={C.mut}/>}</div>
            <div><div style={{fontSize:14,fontWeight:600}}>{userName}</div><div style={{fontSize:11,color:isAdmin?C.acc:C.mut}}>{isAdmin?'Admin':'Notandi'}</div></div>
          </div>
          <Field label="Nafn" value={userName} onChange={v=>{setUserName(v);localStorage.setItem('vrkst-name',v);}} placeholder="Nafn þitt"/>
          <div style={{height:1,background:C.bd,margin:'12px 0'}}/>
          {!isAdmin?(
            <>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}><ILock s={14} c={C.mut}/><span style={{fontSize:12,color:C.mut}}>Admin innskráning</span></div>
              <Field label="Lykilorð" value={pwInput} onChange={setPwInput} placeholder="Admin lykilorð" type="password" action={{label:'Innskrá',fn:loginAdmin}}/>
              {pwError&&<div style={{fontSize:12,color:C.red,marginTop:-8,marginBottom:8}}>Rangt lykilorð</div>}
            </>
          ):(
            <>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:16}}><IKey s={14} c={C.acc}/><span style={{fontSize:13,color:C.acc,fontWeight:600}}>Admin stillingar</span><button onClick={()=>setIsAdmin(false)} style={{marginLeft:'auto',background:'none',border:'none',color:C.mut,cursor:'pointer',fontSize:11,padding:'4px 8px',borderRadius:6,fontFamily:'inherit'}}>Útskrá</button></div>

              <Field label="Nýtt lykilorð" value={newPw} onChange={setNewPw} placeholder="Breyta lykilorði" type="password"
                action={newPw?{label:'Vista',fn:()=>{localStorage.setItem('vrkst-pw',newPw);setNewPw('');showToast('✓ Lykilorð breytt!');}}:undefined}/>

              <div style={{height:1,background:C.bd,margin:'8px 0 14px'}}/>

              {/* Firebase setup */}
              <div style={{background:'rgba(255,170,0,.06)',border:'1px solid rgba(255,170,0,.15)',borderRadius:10,padding:'12px 14px',marginBottom:14}}>
                <div style={{fontSize:11,color:'#fbbf24',fontWeight:600,marginBottom:8}}>🔥 FIREBASE — DEILING MILLI TÆKJA</div>
                {fbUrl
                  ?<div style={{fontSize:12,color:C.grn,display:'flex',alignItems:'center',gap:6}}><ICheck s={13} c={C.grn}/> Virkur — hakarnir deila sér á milli allra tækja</div>
                  :<div style={{fontSize:12,color:'#888',lineHeight:1.7}}>
                    Ókeypis, ótakmarkaðar beiðnir. Bara þörf á einum URL.<br/>
                    1. <b style={{color:'#fbbf24'}}>console.firebase.google.com</b> → Add project<br/>
                    2. Build → Realtime Database → Create database<br/>
                    3. Veldu "Start in test mode" → Enable<br/>
                    4. Afritaðu Database URL (t.d. https://xxx-default-rtdb.firebaseio.com)<br/>
                    5. Límdu hér:
                  </div>
                }
              </div>
              <Field label="Firebase Database URL" value={settFbUrl} onChange={setSettFbUrl} placeholder={fbUrl||'https://your-project-default-rtdb.firebaseio.com'} mono small/>

              <div style={{height:1,background:C.bd,margin:'8px 0 14px'}}/>

              {/* Web3Forms */}
              <div style={{background:'rgba(34,197,94,.06)',border:`1px solid rgba(34,197,94,.15)`,borderRadius:10,padding:'12px 14px',marginBottom:14}}>
                <div style={{fontSize:11,color:C.grn,fontWeight:600,marginBottom:4}}>WEB3FORMS (tölvupóstlykill)</div>
                {web3Key?<div style={{fontSize:12,color:C.grn,display:'flex',alignItems:'center',gap:6}}><ICheck s={13} c={C.grn}/> Virkur</div>:<div style={{fontSize:12,color:'#888'}}>web3forms.com → settu inn atlireynir@gmail.com → "Create Access Key"</div>}
              </div>
              <Field label="Web3Forms lykill" value={settW3} onChange={setSettW3} placeholder={web3Key?'•••••••••':'xxxxxxxx-xxxx-...'} small/>

              <div style={{height:1,background:C.bd,margin:'8px 0 14px'}}/>

              {/* GitHub token */}
              <Field label="GitHub token (til að breyta vörum)" value={ghToken} onChange={v=>{setGhToken(v);localStorage.setItem('vrkst-token',v);}} placeholder="ghp_xxxxxxxxxxxx" mono small
                hint={ghToken?'✓ Virkur':'github.com → Settings → Developer settings → Tokens (classic) → repo scope'}/>

              {/* Save all to config.json */}
              {(settW3||settFbUrl)&&(
                <button onClick={()=>saveConfig({w3:settW3,fbUrl:settFbUrl})} disabled={saving||!ghToken} className="tap"
                  style={{width:'100%',padding:12,borderRadius:10,border:'none',background:ghToken?C.acc:'#333',color:'#fff',fontSize:13,fontWeight:600,cursor:ghToken?'pointer':'default',display:'flex',alignItems:'center',justifyContent:'center',gap:7,fontFamily:'inherit',marginTop:4}}>
                  {saving?<IRefresh s={14} c="#fff" cls="spin"/>:<ICheck s={14} c="#fff"/>}
                  {saving?'Vista...':'Vista á GitHub (allir uppfærðir)'}
                </button>
              )}
            </>
          )}
        </Sheet>
      )}

      {/* ADD ITEM */}
      {modal==='addItem'&&(
        <Sheet onClose={()=>setModal(null)} z={210}>
          <div style={{fontWeight:700,fontSize:17,marginBottom:16}}>Bæta við vöru</div>
          <Field label="Nafn vöru *" value={newItem.name} onChange={v=>setNewItem(p=>({...p,name:v}))} placeholder="t.d. WD-40 sprey"/>
          <Field label="Vörunúmer (SKU)" value={newItem.sku} onChange={v=>setNewItem(p=>({...p,sku:v}))} placeholder="t.d. wd40-400" mono/>
          <div style={{marginBottom:12}}>
            <div style={{fontSize:11,color:C.mut,letterSpacing:1,textTransform:'uppercase',marginBottom:4}}>Flokkur</div>
            <div style={{display:'flex',gap:8}}>
              {['Efnavörur','Perur'].map(c=><button key={c} onClick={()=>setNewItem(p=>({...p,cat:c}))} className="tap" style={{flex:1,padding:'8px',borderRadius:8,border:`1px solid ${newItem.cat===c?C.acc:C.bd}`,background:newItem.cat===c?'rgba(232,93,4,.12)':'transparent',color:newItem.cat===c?C.acc:C.mut,fontSize:13,cursor:'pointer',fontFamily:'inherit'}}>{c}</button>)}
            </div>
          </div>
          <div style={{marginBottom:12}}>
            <div style={{fontSize:11,color:C.mut,letterSpacing:1,textTransform:'uppercase',marginBottom:4}}>Birgir</div>
            <select value={newItem.sup} onChange={e=>setNewItem(p=>({...p,sup:e.target.value}))} style={{width:'100%',background:C.s2,border:`1px solid ${C.bd}`,borderRadius:8,padding:'10px 12px',color:C.txt,fontSize:14,fontFamily:'inherit',outline:'none'}}>
              {ALL_SUPS.map(s=><option key={s} value={s}>{s}</option>)}
            </select>
          </div>
          <Field label="Pöntunarmagn *" value={newItem.qty} onChange={v=>setNewItem(p=>({...p,qty:v}))} placeholder="t.d. 2 brúsar"/>
          <div style={{display:'flex',gap:8}}>
            <button onClick={()=>setModal(null)} className="tap" style={{flex:1,padding:12,borderRadius:10,border:`1px solid ${C.bd}`,background:'none',color:C.mut,fontSize:13,cursor:'pointer',fontFamily:'inherit'}}>Hætta við</button>
            <button onClick={addItem} disabled={saving||!newItem.name||!newItem.qty} className="tap" style={{flex:2,padding:12,borderRadius:10,border:'none',background:newItem.name&&newItem.qty?C.acc:'#333',color:'#fff',fontSize:13,fontWeight:600,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:6,fontFamily:'inherit'}}>
              {saving?<IRefresh s={14} c="#fff" cls="spin"/>:<IPlus s={14} c="#fff"/>}{saving?'Vista...':'Bæta við'}
            </button>
          </div>
        </Sheet>
      )}

      {/* EDIT ITEM */}
      {editItem&&(
        <Sheet onClose={()=>setEditItem(null)} z={210}>
          <div style={{fontWeight:700,fontSize:17,marginBottom:16}}>Breyta vöru</div>
          <Field label="Nafn *" value={editItem.name} onChange={v=>setEditItem(p=>({...p,name:v}))} placeholder="Nafn vöru"/>
          <Field label="Vörunúmer" value={editItem.sku||''} onChange={v=>setEditItem(p=>({...p,sku:v}))} placeholder="VNR" mono/>
          <div style={{marginBottom:12}}>
            <div style={{fontSize:11,color:C.mut,letterSpacing:1,textTransform:'uppercase',marginBottom:4}}>Flokkur</div>
            <div style={{display:'flex',gap:8}}>{['Efnavörur','Perur'].map(c=><button key={c} onClick={()=>setEditItem(p=>({...p,cat:c}))} className="tap" style={{flex:1,padding:'8px',borderRadius:8,border:`1px solid ${editItem.cat===c?C.acc:C.bd}`,background:editItem.cat===c?'rgba(232,93,4,.12)':'transparent',color:editItem.cat===c?C.acc:C.mut,fontSize:13,cursor:'pointer',fontFamily:'inherit'}}>{c}</button>)}</div>
          </div>
          <div style={{marginBottom:12}}>
            <div style={{fontSize:11,color:C.mut,letterSpacing:1,textTransform:'uppercase',marginBottom:4}}>Birgir</div>
            <select value={editItem.sup} onChange={e=>setEditItem(p=>({...p,sup:e.target.value}))} style={{width:'100%',background:C.s2,border:`1px solid ${C.bd}`,borderRadius:8,padding:'10px 12px',color:C.txt,fontSize:14,fontFamily:'inherit',outline:'none'}}>
              {ALL_SUPS.map(s=><option key={s} value={s}>{s}</option>)}
            </select>
          </div>
          <Field label="Magn *" value={editItem.qty} onChange={v=>setEditItem(p=>({...p,qty:v}))} placeholder="t.d. 2 brúsar"/>
          <div style={{display:'flex',gap:8}}>
            <button onClick={()=>setEditItem(null)} className="tap" style={{flex:1,padding:12,borderRadius:10,border:`1px solid ${C.bd}`,background:'none',color:C.mut,fontSize:13,cursor:'pointer',fontFamily:'inherit'}}>Hætta við</button>
            <button onClick={saveEdit} disabled={saving} className="tap" style={{flex:2,padding:12,borderRadius:10,border:'none',background:C.acc,color:'#fff',fontSize:13,fontWeight:600,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:6,fontFamily:'inherit'}}>
              {saving?<IRefresh s={14} c="#fff" cls="spin"/>:<ICheck s={14} c="#fff"/>}{saving?'Vista...':'Vista'}
            </button>
          </div>
        </Sheet>
      )}

      {/* DELETE */}
      {delId&&(
        <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,.87)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:220,padding:24}}>
          <div className="pop" style={{background:C.s1,borderRadius:18,padding:'28px 24px',border:`1px solid ${C.bd}`,width:'100%',maxWidth:340,textAlign:'center'}}>
            <ITrash s={32} c={C.red} st={{marginBottom:14}}/>
            <div style={{fontWeight:700,fontSize:17,marginBottom:8}}>Eyða vöru?</div>
            <div style={{fontSize:13,color:C.mut,marginBottom:24,lineHeight:1.5}}>{items.find(i=>i.id===delId)?.name||''}<br/>Þetta er óafturkræft.</div>
            <div style={{display:'flex',gap:10}}>
              <button onClick={()=>setDelId(null)} className="tap" style={{flex:1,padding:12,borderRadius:10,border:`1px solid ${C.bd}`,background:'none',color:C.txt,fontSize:14,cursor:'pointer',fontFamily:'inherit'}}>Hætta við</button>
              <button onClick={()=>deleteItem(delId)} disabled={saving} className="tap" style={{flex:1,padding:12,borderRadius:10,border:'none',background:C.red,color:'#fff',fontSize:14,fontWeight:600,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:6,fontFamily:'inherit'}}>
                {saving&&<IRefresh s={14} c="#fff" cls="spin"/>}Eyða
              </button>
            </div>
          </div>
        </div>
      )}

      {/* PHOTO */}
      {modal==='photo'&&(
        <div onClick={()=>!photoSending&&resetPhoto()} style={{position:'absolute',inset:0,background:'rgba(0,0,0,.87)',display:'flex',flexDirection:'column',justifyContent:'flex-end',zIndex:200}}>
          <div onClick={e=>e.stopPropagation()} className="sheet" style={{background:C.s1,borderRadius:'18px 18px 0 0',padding:'20px 16px 38px',border:`1px solid ${C.bd}`}}>
            <div style={{width:36,height:4,background:'#333',borderRadius:2,margin:'0 auto 16px'}}/>
            <div style={{fontWeight:700,fontSize:17,marginBottom:4}}>Senda inn tillögu af vöru</div>
            <div style={{fontSize:12,color:C.mut,marginBottom:14}}>{userName} → {adminName}</div>
            {photoPreview&&<div style={{position:'relative',marginBottom:12}}>
              <img src={photoPreview} alt="preview" style={{width:'100%',borderRadius:10,maxHeight:200,objectFit:'cover'}}/>
              <button onClick={()=>photoRef.current&&photoRef.current.click()} className="tap" style={{position:'absolute',bottom:8,right:8,background:'rgba(0,0,0,.7)',border:'none',borderRadius:8,padding:'6px 10px',color:'#fff',fontSize:11,cursor:'pointer',display:'flex',alignItems:'center',gap:5,fontFamily:'inherit'}}><ICamera s={12} c="#fff"/> Önnur mynd</button>
            </div>}
            <div style={{marginBottom:14}}>
              <div style={{fontSize:11,color:C.mut,letterSpacing:1,textTransform:'uppercase',marginBottom:4}}>Lýsing</div>
              <textarea value={photoDesc} onChange={e=>setPhotoDesc(e.target.value)} placeholder="Hvað er þetta? Hvar er það notað?" rows={3} style={{width:'100%',background:C.s2,border:`1px solid ${C.bd}`,borderRadius:8,padding:'10px 12px',color:C.txt,fontSize:14,fontFamily:'inherit',outline:'none',resize:'none'}}/>
            </div>
            {photoErr&&<div style={{fontSize:12,color:C.red,marginBottom:12}}>{photoErr}</div>}
            <div style={{display:'flex',gap:8}}>
              <button onClick={resetPhoto} disabled={photoSending} className="tap" style={{flex:1,padding:12,borderRadius:10,border:`1px solid ${C.bd}`,background:'none',color:C.mut,fontSize:13,cursor:'pointer',fontFamily:'inherit',opacity:photoSending?.5:1}}>Hætta við</button>
              <button onClick={sendPhoto} disabled={photoSending} className="tap" style={{flex:2,padding:12,borderRadius:10,border:'none',background:C.acc,color:'#fff',fontSize:13,fontWeight:600,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:7,fontFamily:'inherit',opacity:photoSending?.7:1}}>
                {photoSending?<IRefresh s={14} c="#fff" cls="spin"/>:<ICamera s={14} c="#fff"/>}{photoSending?'Sendi...':'Senda tillögu'}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ORDER SHARE */}
      {orderShare&&(
        <Sheet onClose={()=>setOrderShare(null)}>
          <div style={{fontWeight:700,fontSize:17,marginBottom:3}}>Senda pöntun</div>
          <div style={{fontSize:11,color:C.mut,fontFamily:"'Fira Code',monospace",marginBottom:12}}>{orderShare.to}</div>
          <div style={{background:C.bg,borderRadius:10,padding:'10px 12px',fontSize:11,fontFamily:"'Fira Code',monospace",color:'#888',maxHeight:160,overflowY:'auto',marginBottom:14,whiteSpace:'pre-wrap',border:`1px solid ${C.bd}`,lineHeight:1.6}}>{orderShare.body}</div>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {navigator.share&&<button onClick={()=>navigator.share({title:orderShare.subject,text:orderShare.body}).catch(()=>{})} className="tap" style={{width:'100%',padding:13,borderRadius:12,border:'none',background:C.acc,color:'#fff',fontSize:14,fontWeight:600,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:8,fontFamily:'inherit'}}><IShare s={16} c="#fff"/> Deila</button>}
            <button onClick={()=>navigator.clipboard.writeText(orderShare.body).then(()=>showToast('✓ Afritað')).catch(()=>{})} className="tap" style={{width:'100%',padding:12,borderRadius:12,border:`1px solid ${C.bd}`,background:C.s2,color:C.txt,fontSize:13,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:7,fontFamily:'inherit'}}><ICopy s={14} c={C.txt}/> Afrita</button>
            <button onClick={()=>window.open(`mailto:${orderShare.to}?subject=${encodeURIComponent(orderShare.subject)}&body=${encodeURIComponent(orderShare.body)}`)} className="tap" style={{width:'100%',padding:12,borderRadius:12,border:`1px solid ${C.bd}`,background:'transparent',color:C.mut,fontSize:13,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:7,fontFamily:'inherit'}}><IMail s={14} c={C.mut}/> Opna í tölvupósti</button>
          </div>
        </Sheet>
      )}

      {/* NOTIFICATION SUCCESS — með flugeldum 🎉 */}
      {notifDone&&(
        <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,.93)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:250,padding:24,overflow:'hidden'}}>
          <canvas ref={confettiRef} style={{position:'absolute',inset:0,width:'100%',height:'100%',pointerEvents:'none'}}/>
          <div className="pop" style={{background:C.s1,borderRadius:24,padding:'44px 28px',border:`1px solid ${C.bd}`,textAlign:'center',width:'100%',maxWidth:340,position:'relative',zIndex:2}}>
            <div style={{fontSize:60,marginBottom:16}}>🎉</div>
            <div style={{fontFamily:'Oxanium,sans-serif',fontSize:22,fontWeight:700,color:C.grn,marginBottom:14}}>Tilkynning send!</div>
            <div style={{fontSize:15,color:C.txt,lineHeight:1.6,marginBottom:16}}>
              <span style={{color:C.acc,fontWeight:700}}>{adminName}</span> hefur fengið tilkynningu um að panta vörur
            </div>
            <div style={{background:'rgba(232,93,4,.08)',border:`1px solid rgba(232,93,4,.2)`,borderRadius:12,padding:'14px 16px',marginBottom:24}}>
              <div style={{fontSize:14,color:C.acc,fontWeight:600,lineHeight:1.5}}>{hvatning}</div>
            </div>
            <button onClick={()=>setNotifDone(false)} className="tap"
              style={{width:'100%',padding:14,borderRadius:12,border:'none',background:C.acc,color:'#fff',fontSize:15,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>
              Allt í lagi 👍
            </button>
          </div>
        </div>
      )}

      {/* TOAST */}
      {toast&&<div className="anim" style={{position:'absolute',bottom:72,left:'50%',transform:'translateX(-50%)',background:'#1e1e1e',border:`1px solid ${C.bd}`,borderRadius:20,padding:'7px 16px',fontSize:12,color:C.txt,whiteSpace:'nowrap',boxShadow:'0 4px 20px rgba(0,0,0,.5)',zIndex:300,pointerEvents:'none'}}>{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
